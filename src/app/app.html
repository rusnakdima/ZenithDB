<div class="theme fixed inset-0 flex w-full flex-col">
  <app-header class="flex-shrink-0"></app-header>
  <main
    class="page-content flex-1 px-4 sm:px-6"
    [class.page-explorer]="isExplorerRoute()"
    style="height: calc(100vh - 56px - 16px); min-height: 0; overflow-y: auto"
  >
    <router-outlet></router-outlet>
  </main>
  <app-floating-bottom-nav class="flex-shrink-0"></app-floating-bottom-nav>
</div>

@for (dialog of dialogService.dialogs(); track dialog.id) {
  @if (dialog.component) {
    <ng-container
      *ngComponentOutlet="dialog.component; inputs: dialog.inputs; outputs: dialog.outputs"
    ></ng-container>
  }
}

<app-connection-modal #connectionModal></app-connection-modal>
<app-connection-form></app-connection-form>
<app-confirm-dialog></app-confirm-dialog>
<app-loading-overlay></app-loading-overlay>
<app-toast-container></app-toast-container>
<app-shortcuts-help-dialog></app-shortcuts-help-dialog>
