<div class="app-layout transition-colors duration-200">
  <app-header></app-header>

  <div class="flex min-h-0 flex-1 overflow-hidden">
    <app-sidebar></app-sidebar>

    <!-- Main Content -->
    <main
      class="app-main flex min-h-0 flex-1 flex-col overflow-hidden transition-colors duration-200"
    >
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Global Dialogs -->
  @for (dialog of dialogService.dialogs(); track dialog.id) {
    @if (dialog.component) {
      <ng-container
        *ngComponentOutlet="dialog.component; inputs: dialog.inputs; outputs: dialog.outputs"
      ></ng-container>
    }
  }

  <app-command-palette></app-command-palette>
  <app-loading-overlay></app-loading-overlay>
  <app-toast-container></app-toast-container>
  <app-shortcuts-help-dialog></app-shortcuts-help-dialog>
</div>
