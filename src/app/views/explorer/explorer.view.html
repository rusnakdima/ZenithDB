<div class="explorer-page flex h-[calc(100vh-150px)] flex-1 flex-row bg-[var(--bg-deep)]">
  <app-explorer-sidebar
    [collapsed]="treeCollapsed()"
    (collectionSelect)="onTreeCollectionSelect($event)"
  ></app-explorer-sidebar>

  <div class="flex flex-1 flex-col">
    <app-explorer-toolbar
      [stats]="stats()"
      [treeCollapsed]="treeCollapsed()"
      [showExportMenu]="showExportMenu()"
      (toggleTreeCollapse)="toggleTreeCollapse()"
      (openCompareTables)="openCompareTables()"
      (onImport)="onImport()"
      (toggleExportMenu)="toggleExportMenu()"
      (onExport)="onExport($event)"
    ></app-explorer-toolbar>

    <app-collection-tabs
      [tabs]="activeTabs()"
      [activeCollection]="activeCollection()"
      (tabSelect)="selectTab($event)"
      (tabClose)="closeTab($event)"
    ></app-collection-tabs>

    @if (activeCollection()) {
      <app-explorer-filter-panel></app-explorer-filter-panel>

      <div
        class="flex items-center gap-3 border-b border-[var(--border-subtle)] bg-[var(--bg-sidebar)] px-4 py-2"
      >
        <app-segment-selector
          [options]="viewModeOptions"
          [active]="viewTab()"
          (select)="onViewModeChange($event)"
        ></app-segment-selector>
      </div>

      <div class="relative flex flex-1 flex-col overflow-hidden" style="min-width: 0; height: 100%">
        @switch (viewTab()) {
          @case ("table") {
            <div class="flex flex-1 flex-col overflow-hidden" style="min-width: 0; height: 100%">
              <app-data-table-grid
                style="height: 100%"
                [collectionName]="activeCollection()"
                [filter]="filterText()"
                [page]="page()"
                [pageSize]="pageSize()"
                [inputVisibleColumns]="selectedColumns()"
                [columns]="availableColumnsMeta()"
                [reloadTrigger]="reloadTrigger()"
                (documentClick)="openInspector($event)"
                (pageChange)="onPageChange($event)"
                (columnsOrderChange)="onColumnsOrderChange($event)"
              ></app-data-table-grid>
            </div>
            <app-pagination
              class="flex-shrink-0"
              [totalItems]="stats()?.document_count ?? 0"
              [currentPage]="page()"
              [pageSize]="pageSize()"
              (pageChange)="onPageChange($event)"
              (pageSizeChange)="onPageSizeChange($event)"
            ></app-pagination>
          }
          @case ("json") {
            <div class="flex flex-1 flex-col overflow-hidden" style="min-width: 0; height: 100%">
              <app-json-view
                class="h-full"
                [fullJsonData]="fullJsonData()"
                [jsonLoading]="jsonLoading()"
                [jsonHasMore]="jsonHasMore()"
                [jsonLoadingMore]="jsonLoadingMore()"
                [jsonDocumentsMap]="jsonDocumentsMap()"
                (copyRowJson)="copyRowJson($event.doc, $event.docIndex)"
                (openInspector)="openInspector($event)"
                (loadMore)="loadMoreJsonData()"
                (copyJsonToClipboard)="copyJsonToClipboard()"
              ></app-json-view>
            </div>
          }
        }
      </div>
    }

    @if (showInspector() && inspectorDocument()) {
      <app-inspector-drawer
        [document]="inspectorDocument()!"
        (close)="closeInspector()"
        (delete)="deleteDocument(inspectorDocument()!)"
      ></app-inspector-drawer>
    }

    @if (showCompareTables()) {
      <app-compare-tables-dialog
        [collections]="collections()"
        [connectionId]="currentConnectionId"
        (close)="closeCompareTables()"
      ></app-compare-tables-dialog>
    }
  </div>
</div>
