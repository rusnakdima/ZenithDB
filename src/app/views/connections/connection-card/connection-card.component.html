<div
  class="card group cursor-pointer transition-all duration-300 hover:border-[var(--accent)]/50 hover:shadow-[var(--accent)]/10 hover:shadow-lg"
  [class.border-2]="showActions()"
  [class.border-[var(--accent)]]="showActions()"
  (mouseenter)="showCardActions()"
  (mouseleave)="hideCardActions()"
  (click)="onConnect()"
>
  <div class="card-decoration"></div>

  <div class="card-header">
    <div class="card-icon-box">
      <mat-icon
        [fontIcon]="providerUtils.getProviderIcon(connection().provider)"
        class="!text-xl"
      ></mat-icon>
    </div>
    <div class="card-status-area">
      <div class="card-status-row">
        <span
          class="card-status-dot"
          [class.card-status-dot-connected]="connection().status === 'connected'"
          [class.card-status-dot-offline]="connection().status !== 'connected'"
        ></span>
        <span class="card-status-badge {{ statusClass }}">{{ statusLabel }}</span>
      </div>
      <div class="card-uptime">{{ lastConnectedLabel }}</div>
    </div>
  </div>

  <h3 class="card-name">{{ connection().name }}</h3>
  <p class="card-uri">{{ connection().provider }}</p>

  <div class="card-tags">
    <span class="card-tag">{{ connection().provider }}</span>
  </div>

  <div
    class="absolute top-4 right-4 flex gap-1 opacity-0 transition-opacity group-hover:opacity-100"
    (click)="$event.stopPropagation()"
  >
    <button
      (click)="onEdit($event)"
      class="rounded-lg bg-[var(--bg-elevated)] p-2 text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-card)] hover:text-[var(--text-main)]"
      title="Edit"
    >
      <mat-icon fontIcon="edit" class="!text-xl"></mat-icon>
    </button>
    <button
      (click)="onDuplicate($event)"
      class="rounded-lg bg-[var(--bg-elevated)] p-2 text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-card)] hover:text-[var(--text-main)]"
      title="Duplicate"
    >
      <mat-icon fontIcon="content_copy" class="!text-xl"></mat-icon>
    </button>
    <button
      (click)="onDelete($event)"
      class="rounded-lg bg-red-500/10 p-2 text-red-500 transition-colors hover:bg-red-500/20"
      title="Delete"
    >
      <mat-icon fontIcon="delete" class="!text-xl"></mat-icon>
    </button>
  </div>
</div>
