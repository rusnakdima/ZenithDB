<div class="flex h-full flex-col font-mono text-sm">
  <div class="flex flex-1 overflow-hidden">
    <!-- Line Numbers Gutter -->
    <div
      class="flex min-h-full w-12 shrink-0 flex-col bg-neutral-800/30 pt-3 pr-4 text-right text-neutral-600 select-none"
    >
      @for (line of lines; track $index) {
        <span class="px-2 font-mono text-xs leading-6">{{ $index + 1 }}</span>
      }
      @if (lines.length === 0) {
        <span class="px-2 font-mono text-xs leading-6">1</span>
      }
    </div>

    <!-- Editor Area -->
    <div class="relative flex-1 overflow-auto">
      <textarea
        class="absolute inset-0 z-10 h-full w-full cursor-text resize-none border-none bg-transparent px-4 py-3 font-mono text-sm leading-6 text-neutral-200 outline-none placeholder:text-neutral-600"
        [value]="query"
        (input)="onInput($event)"
        (keydown)="handleKeydown($event)"
        spellcheck="false"
        placeholder="Enter SQL query... (e.g., SELECT * FROM users LIMIT 10)"
      ></textarea>
      <!-- Overlay for visual display (optional, for syntax highlighting placeholder) -->
      <div class="pointer-events-none invisible h-full"></div>
    </div>
  </div>

  <!-- SQL Keywords Reference -->
  <div
    class="flex items-center gap-4 border-t border-neutral-800/50 px-4 py-2 text-xs text-neutral-600"
  >
    <span>Keywords:</span>
    <span class="rounded bg-neutral-800 px-1.5 py-0.5 text-neutral-400">SELECT</span>
    <span class="rounded bg-neutral-800 px-1.5 py-0.5 text-neutral-400">FROM</span>
    <span class="rounded bg-neutral-800 px-1.5 py-0.5 text-neutral-400">WHERE</span>
    <span class="rounded bg-neutral-800 px-1.5 py-0.5 text-neutral-400">JOIN</span>
    <span class="rounded bg-neutral-800 px-1.5 py-0.5 text-neutral-400">LIMIT</span>
  </div>
</div>
