<div class="flex h-full flex-col">
  <div class="flex items-center justify-between border-b border-slate-800 p-2">
    <span class="text-xs font-bold text-slate-400">Output Console</span>
    <button (click)="clear.emit()" class="text-xs text-slate-500 hover:text-slate-300">
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
        ></path>
      </svg>
    </button>
  </div>

  <div class="flex-grow overflow-auto p-3 font-mono text-xs">
    @if (loading) {
      <div class="text-slate-400">Executing...</div>
    } @else if (error) {
      <div class="text-red-400">{{ error }}</div>
    } @else if (results) {
      <div class="mb-2 text-green-500">[SUCCESS] Query finished in {{ executionTime }}ms.</div>
      <div class="mb-2 text-slate-400">{{ recordsCount }} records returned</div>
      <pre class="whitespace-pre-wrap text-green-400">{{ results | json }}</pre>
    } @else {
      <div class="text-slate-500">No results yet. Run a query to see output here.</div>
    }
  </div>
</div>
