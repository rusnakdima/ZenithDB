<header class="app-header">
  <div class="flex items-center gap-3">
    <span class="text-xs font-bold tracking-widest text-[var(--text-dim)] uppercase"
      >Workspace</span
    >
    <mat-icon fontIcon="chevron_right" class="!text-xs !text-[var(--text-muted)]"></mat-icon>
    <span class="text-xs font-black tracking-widest text-[var(--text-main)] uppercase">{{
      getCurrentBreadcrumb()
    }}</span>
  </div>

  <div class="flex items-center gap-6">
    <div class="group relative">
      <mat-icon
        fontIcon="search"
        class="absolute top-1/2 left-3 -translate-y-1/2 !text-xs !text-[var(--text-dim)]"
      ></mat-icon>
      <input
        type="text"
        placeholder="Search data, collections..."
        class="w-64 rounded-lg border border-[var(--border-subtle)] bg-[var(--bg-card)] py-1.5 pr-4 pl-9 text-[11px] transition-all outline-none focus:border-[var(--accent)]/50"
      />
    </div>
    <div
      class="flex h-8 w-8 items-center justify-center rounded-full border border-[var(--border-subtle)] bg-[var(--bg-elevated)]"
    >
      <mat-icon fontIcon="person" class="!text-xs !text-[var(--text-dim)]"></mat-icon>
    </div>
  </div>
</header>
