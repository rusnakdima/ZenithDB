<header class="header">
  <div class="flex items-center gap-6">
    <div class="flex items-center gap-2">
      <div class="rounded bg-gradient-to-br from-blue-500 to-indigo-600 p-1.5 shadow-lg">
        <i class="fas fa-atom text-xs text-white"></i>
      </div>
      <h1 class="text-sm font-black tracking-tighter uppercase italic">
        Zenith<span class="text-blue-500">DB</span>
      </h1>
    </div>
    <div
      class="flex items-center gap-1 text-[11px] font-medium tracking-widest text-slate-500 uppercase"
    >
      <a routerLink="/connections" class="px-2 py-1 transition hover:text-white">Connections</a>
      <i class="fas fa-chevron-right text-[8px]"></i>
      @if (connectionState.activeConnectionName()) {
        <button class="px-2 py-1 hover:text-white">
          {{ connectionState.activeConnectionName() }}
        </button>
        <i class="fas fa-chevron-right text-[8px]"></i>
      }
      <button class="rounded bg-blue-500/10 px-2 py-1 text-blue-400">Explorer</button>
    </div>
  </div>

  <div class="flex items-center gap-4">
    <div class="flex items-center rounded-lg border border-slate-700 bg-slate-800 p-0.5">
      <button class="rounded-md px-3 py-1 text-xs transition hover:text-white">Gallery</button>
      <button class="rounded-md bg-slate-700 px-3 py-1 text-xs text-white shadow-sm">
        Explorer
      </button>
      <button class="rounded-md px-3 py-1 text-xs transition hover:text-white">Workbench</button>
    </div>
    <div class="h-4 w-px bg-slate-700"></div>
    <button class="text-slate-400 transition hover:text-white" (click)="toggleTheme()">
      <i class="fas fa-circle-half-stroke"></i>
    </button>
    <div class="flex items-center gap-2 pl-2">
      <div
        class="flex h-6 w-6 items-center justify-center rounded-full bg-gradient-to-tr from-orange-400 to-red-500 text-[10px] font-bold"
      >
        JD
      </div>
    </div>
  </div>
</header>
