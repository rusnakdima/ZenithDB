<div
  class="flex flex-wrap items-center justify-between gap-3 border-b border-slate-800 bg-slate-900/30 p-3"
>
  <div class="flex flex-wrap items-center gap-2">
    <div
      class="group flex max-w-xl flex-grow items-center gap-2 rounded-md border border-slate-700 bg-slate-800 px-3 py-1.5 transition focus-within:ring-1"
      [class.ring-red-500]="filterError()"
      [class.border-red-500]="filterError()"
    >
      <svg
        class="h-4 w-4 text-slate-500"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
      <input
        type="text"
        [ngModel]="filter()"
        (ngModelChange)="onFilterInput($event); filter.set($event)"
        (keyup.enter)="applyFilter()"
        [placeholder]="filterPlaceholder()"
        class="w-full border-none bg-transparent text-sm text-white outline-none"
      />
      @if (filterError()) {
        <svg
          class="h-4 w-4 text-red-500"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      }
    </div>
    @if (filterError()) {
      <span class="text-xs text-red-500">{{ filterError() }}</span>
    }
    <div class="flex gap-1">
      <button
        class="rounded-md bg-blue-600 px-4 py-1.5 text-xs font-bold text-white transition hover:bg-blue-500"
        (click)="applyFilter()"
      >
        Apply
      </button>
      <button
        class="rounded-md bg-slate-800 px-3 py-1.5 text-xs font-bold text-slate-300 transition hover:bg-slate-700"
        (click)="clearFilter()"
      >
        Clear
      </button>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <div class="relative">
      <button
        class="flex items-center gap-2 rounded-md bg-slate-800 px-3 py-1.5 text-xs font-bold text-slate-300 transition hover:bg-slate-700"
        (click)="toggleBulkMenu()"
      >
        <span>Bulk Actions</span>
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      @if (showBulkMenu()) {
        <div
          class="absolute top-full right-0 z-20 mt-1 w-44 rounded-md border border-slate-700 bg-slate-800 py-1 shadow-lg"
        >
          @for (action of bulkActions; track action.id) {
            @if (action.id === "delete") {
              <button
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-red-400 hover:bg-slate-700"
                (click)="performBulkAction(action.id)"
              >
                <svg
                  class="h-4 w-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                  />
                </svg>
                {{ action.label }}
              </button>
            } @else if (action.id === "export") {
              <button
                class="flex w-full items-center gap-2 px-4 py-2 text-left text-sm text-slate-300 hover:bg-slate-700"
                (click)="performBulkAction(action.id)"
              >
                <svg
                  class="h-4 w-4"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  stroke-width="2"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                  />
                </svg>
                {{ action.label }}
              </button>
            }
          }
        </div>
      }
    </div>
    <button
      class="rounded-md bg-slate-800 p-2 text-slate-400 transition hover:bg-slate-700 hover:text-white"
      title="Refresh"
      (click)="performRefresh()"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        />
      </svg>
    </button>
    <div class="mx-2 h-6 w-px bg-slate-800"></div>
    <div class="flex items-center gap-1 rounded-md bg-slate-800 p-1">
      <button
        class="rounded p-1.5 transition"
        [class.text-blue-400]="viewMode() === 'grid'"
        [class.bg-blue-500/10]="viewMode() === 'grid'"
        (click)="setViewMode('grid')"
        title="Grid View"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          />
        </svg>
      </button>
      <button
        class="rounded p-1.5 transition"
        [class.text-blue-400]="viewMode() === 'list'"
        [class.bg-blue-500/10]="viewMode() === 'list'"
        (click)="setViewMode('list')"
        title="List View"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 10h16M4 14h16M4 18h16"
          />
        </svg>
      </button>
      <button
        class="rounded p-1.5 transition"
        [class.text-blue-400]="viewMode() === 'json'"
        [class.bg-blue-500/10]="viewMode() === 'json'"
        (click)="setViewMode('json')"
        title="JSON View"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"
          />
        </svg>
      </button>
    </div>
  </div>
</div>
