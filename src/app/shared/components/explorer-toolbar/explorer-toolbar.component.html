<div
  class="flex items-center justify-between border-b border-[var(--border-subtle)] bg-[var(--bg-sidebar)] px-4 py-3"
>
  <div class="flex items-center gap-4">
    <button
      class="flex items-center rounded-lg border border-[var(--accent)] bg-transparent p-2 transition-all hover:text-[var(--accent)]"
      (click)="toggleTreeCollapse.emit()"
      [title]="treeCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <mat-icon [fontIcon]="treeCollapsed() ? 'menu' : 'menu_open'" class="h-5! w-4! text-base!" />
    </button>
    <h1 class="text-xl font-bold text-[var(--text-main)]">Explorer</h1>
  </div>
  <div class="flex items-center gap-3">
    <button
      class="flex items-center gap-2 rounded-lg border border-[var(--accent)] bg-transparent px-3 py-2 text-sm font-medium text-[var(--text-dim)] transition-all hover:text-[var(--accent)]"
      (click)="openCompareTables.emit()"
    >
      <mat-icon fontIcon="compare_arrows" class="h-5! w-4! text-base!" />
      <span class="hidden lg:inline">Compare</span>
    </button>
    <button
      class="flex items-center gap-2 rounded-lg border border-[var(--accent)] bg-transparent px-3 py-2 text-sm font-medium text-[var(--text-dim)] transition-all hover:text-[var(--accent)]"
      (click)="onImport.emit()"
    >
      <mat-icon fontIcon="upload" class="h-5! w-4! text-base!" />
      <span class="hidden lg:inline">Import</span>
    </button>
    <button
      class="flex items-center gap-2 rounded-lg bg-[var(--accent)] px-3 py-2 text-sm font-bold text-black transition-all hover:shadow-[0_0_20px_var(--accent)]"
      (click)="createDocument.emit()"
    >
      <mat-icon fontIcon="add" class="h-5! w-4! text-base!" />
      <span class="hidden lg:inline">New Doc</span>
    </button>
    <div class="relative">
      <button
        class="flex items-center gap-2 rounded-lg border border-[var(--accent)] bg-transparent px-3 py-2 text-sm font-medium text-[var(--text-dim)] transition-all hover:text-[var(--accent)]"
        (click)="toggleExportMenu.emit()"
      >
        <mat-icon fontIcon="download" class="h-5! w-4! text-base!" />
        <span class="hidden lg:inline">Export</span>
        <mat-icon fontIcon="expand_more" class="hidden h-4! w-4! text-xs! lg:inline" />
      </button>
      @if (showExportMenu()) {
        <app-export-menu-dropdown
          [show]="true"
          (export)="onExport.emit($event)"
          (close)="toggleExportMenu.emit()"
        ></app-export-menu-dropdown>
      }
    </div>
  </div>
</div>
