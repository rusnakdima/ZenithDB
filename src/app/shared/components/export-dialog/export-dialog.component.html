<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black/60"
  (click)="cancelExport()"
>
  <div
    class="w-full max-w-md rounded-xl border border-slate-700 bg-slate-900 shadow-2xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-slate-700 px-6 py-4">
      <h2 class="text-lg font-semibold text-slate-100">{{ title }}</h2>
      <button
        class="text-slate-400 transition-colors hover:text-slate-200"
        (click)="cancelExport()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <div class="space-y-5 p-6">
      <div>
        <label class="mb-2 block text-sm font-medium text-slate-300">Format</label>
        <div class="grid grid-cols-2 gap-2">
          @for (f of formats; track f.value) {
            <button
              class="rounded-lg border px-3 py-2 text-sm transition-colors"
              [class.bg-emerald-500/20-border-emerald-500]="format() === f.value"
              [class.text-emerald-400]="format() === f.value"
              [class.bg-slate-800-border-slate-600]="format() !== f.value"
              [class.text-slate-300]="format() !== f.value"
              (click)="onFormatChange(f.value)"
            >
              {{ f.label }}
            </button>
          }
        </div>
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-slate-300">Filename</label>
        <input
          type="text"
          class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none"
          [value]="filename()"
          (input)="filename.set($any($event.target).value)"
        />
      </div>

      @if (format() === "sql") {
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-300">Table Name</label>
          <input
            type="text"
            class="w-full rounded-lg border border-slate-600 bg-slate-800 px-3 py-2 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none"
            [value]="tableName()"
            (input)="tableName.set($any($event.target).value)"
          />
        </div>
      }

      @if (format() === "csv") {
        <div class="flex items-center gap-2">
          <input
            type="checkbox"
            id="includeHeaders"
            class="rounded border-slate-600 bg-slate-800 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
            [checked]="includeHeaders()"
            (change)="includeHeaders.set($any($event.target).checked)"
          />
          <label for="includeHeaders" class="text-sm text-slate-300">Include headers</label>
        </div>
      }

      @if (showScopeSelection) {
        <div>
          <label class="mb-2 block text-sm font-medium text-slate-300">Scope</label>
          <div class="flex gap-2">
            @for (s of scopes; track s.value) {
              <button
                class="flex-1 rounded-lg border px-3 py-2 text-sm transition-colors"
                [class.bg-emerald-500/20-border-emerald-500]="scope() === s.value"
                [class.text-emerald-400]="scope() === s.value"
                [class.bg-slate-800-border-slate-600]="scope() !== s.value"
                [class.text-slate-300]="scope() !== s.value"
                (click)="scope.set(s.value)"
              >
                {{ s.label }}
              </button>
            }
          </div>
        </div>
      }

      @if (isExporting()) {
        <div class="space-y-2">
          <div class="flex items-center justify-between text-sm">
            <span class="text-slate-400">Exporting...</span>
            <span class="text-emerald-400">{{ progress() }}%</span>
          </div>
          <div class="h-2 overflow-hidden rounded-full bg-slate-800">
            <div
              class="h-full bg-emerald-500 transition-all duration-300"
              [style.width.%]="progress()"
            ></div>
          </div>
        </div>
      }
    </div>

    <div class="flex justify-end gap-3 border-t border-slate-700 px-6 py-4">
      <button
        class="px-4 py-2 text-sm text-slate-300 transition-colors hover:text-slate-100"
        (click)="cancelExport()"
        [disabled]="isExporting()"
      >
        Cancel
      </button>
      <button
        class="rounded-lg bg-emerald-600 px-4 py-2 text-sm text-white transition-colors hover:bg-emerald-500 disabled:cursor-not-allowed disabled:opacity-50"
        (click)="executeExport()"
        [disabled]="isExporting() || !filename()"
      >
        @if (isExporting()) {
          Exporting...
        } @else {
          Export
        }
      </button>
    </div>
  </div>
</div>
