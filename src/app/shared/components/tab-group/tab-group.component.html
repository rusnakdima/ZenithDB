<nav class="space-y-1">
  @for (tab of tabs(); track tab.id) {
    <button
      class="w-full rounded-lg px-3 py-2 text-left text-sm transition-colors"
      [class.bg-emerald-500/20-text-emerald-400]="activeTab() === tab.id"
      [class.text-gray-500]="activeTab() !== tab.id"
      [class.hover:bg-gray-100]="activeTab() !== tab.id"
      [class.dark:text-gray-400-dark:hover:bg-gray-800]="activeTab() !== tab.id"
      (click)="switchTab(tab.id)"
    >
      {{ tab.label }}
    </button>
  }
</nav>
