<div class="fixed inset-0 bg-black/60 flex items-center justify-center z-50" (click)="cancelSettings()">
  <div class="bg-slate-900 rounded-xl border border-slate-700 shadow-2xl w-full max-w-2xl max-h-[80vh] flex flex-col" (click)="$event.stopPropagation()">
    <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
      <h2 class="text-lg font-semibold text-slate-100">Settings</h2>
      <button class="text-slate-400 hover:text-slate-200 transition-colors" (click)="cancelSettings()">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 6L6 18M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <div class="flex flex-1 overflow-hidden">
      <div class="w-48 border-r border-slate-700 p-4">
        <nav class="space-y-1">
          <button
            class="w-full px-3 py-2 text-sm text-left rounded-lg transition-colors"
            [class.bg-emerald-500/20-text-emerald-400]="activeTab() === 'general'"
            [class.text-slate-400]="activeTab() !== 'general'"
            [class.hover:bg-slate-800]="activeTab() !== 'general'"
            (click)="switchTab('general')"
          >
            General
          </button>
          <button
            class="w-full px-3 py-2 text-sm text-left rounded-lg transition-colors"
            [class.bg-emerald-500/20-text-emerald-400]="activeTab() === 'editor'"
            [class.text-slate-400]="activeTab() !== 'editor'"
            [class.hover:bg-slate-800]="activeTab() !== 'editor'"
            (click)="switchTab('editor')"
          >
            Editor
          </button>
          <button
            class="w-full px-3 py-2 text-sm text-left rounded-lg transition-colors"
            [class.bg-emerald-500/20-text-emerald-400]="activeTab() === 'data'"
            [class.text-slate-400]="activeTab() !== 'data'"
            [class.hover:bg-slate-800]="activeTab() !== 'data'"
            (click)="switchTab('data')"
          >
            Data
          </button>
          <button
            class="w-full px-3 py-2 text-sm text-left rounded-lg transition-colors"
            [class.bg-emerald-500/20-text-emerald-400]="activeTab() === 'connections'"
            [class.text-slate-400]="activeTab() !== 'connections'"
            [class.hover:bg-slate-800]="activeTab() !== 'connections'"
            (click)="switchTab('connections')"
          >
            Connections
          </button>
        </nav>
      </div>

      <div class="flex-1 p-6 overflow-y-auto">
        @if (activeTab() === "general") {
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Theme</label>
              <div class="flex gap-2">
                @for (opt of themeOptions; track opt.value) {
                  <button
                    class="px-4 py-2 text-sm rounded-lg border transition-colors"
                    [class.bg-emerald-500/20-border-emerald-500]="currentSettings.general.theme === opt.value"
                    [class.text-emerald-400]="currentSettings.general.theme === opt.value"
                    [class.bg-slate-800-border-slate-600]="currentSettings.general.theme !== opt.value"
                    [class.text-slate-300]="currentSettings.general.theme !== opt.value"
                    (click)="updateGeneralTheme(opt.value)"
                  >
                    {{ opt.label }}
                  </button>
                }
              </div>
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="startMinimized"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.general.startMinimized"
                (change)="updateGeneral({ startMinimized: $any($event.target).checked })"
              />
              <label for="startMinimized" class="text-sm text-slate-300">Start minimized to tray</label>
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="checkUpdates"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.general.checkUpdates"
                (change)="updateGeneral({ checkUpdates: $any($event.target).checked })"
              />
              <label for="checkUpdates" class="text-sm text-slate-300">Check for updates on startup</label>
            </div>

            <button
              class="px-4 py-2 text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-slate-600 transition-colors"
              (click)="checkForUpdates()"
            >
              Check for Updates
            </button>
          </div>
        }

        @if (activeTab() === "editor") {
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Font Size</label>
              <div class="flex items-center gap-4">
                <input
                  type="range"
                  min="10"
                  max="24"
                  class="flex-1 accent-emerald-500"
                  [value]="currentSettings.editor.fontSize"
                  (input)="updateEditor({ fontSize: +$any($event.target).value })"
                />
                <span class="text-sm text-slate-400 w-12 text-right">{{ currentSettings.editor.fontSize }}px</span>
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Tab Size</label>
              <div class="flex gap-2">
                @for (size of tabSizeOptions; track size) {
                  <button
                    class="px-4 py-2 text-sm rounded-lg border transition-colors"
                    [class.bg-emerald-500/20-border-emerald-500]="currentSettings.editor.tabSize === size"
                    [class.text-emerald-400]="currentSettings.editor.tabSize === size"
                    [class.bg-slate-800-border-slate-600]="currentSettings.editor.tabSize !== size"
                    [class.text-slate-300]="currentSettings.editor.tabSize !== size"
                    (click)="updateEditor({ tabSize: size })"
                  >
                    {{ size }}
                  </button>
                }
              </div>
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="autoSave"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.editor.autoSave"
                (change)="updateEditor({ autoSave: $any($event.target).checked })"
              />
              <label for="autoSave" class="text-sm text-slate-300">Auto-save editor content</label>
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="lineNumbers"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.editor.lineNumbers"
                (change)="updateEditor({ lineNumbers: $any($event.target).checked })"
              />
              <label for="lineNumbers" class="text-sm text-slate-300">Show line numbers</label>
            </div>
          </div>
        }

        @if (activeTab() === "data") {
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Default Page Size</label>
              <select
                class="bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                [value]="currentSettings.data.defaultPageSize"
                (change)="updateData({ defaultPageSize: +$any($event.target).value })"
              >
                @for (size of pageSizeOptions; track size) {
                  <option [value]="size">{{ size }}</option>
                }
              </select>
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Max Rows to Display</label>
              <input
                type="number"
                min="100"
                max="10000"
                step="100"
                class="w-32 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                [value]="currentSettings.data.maxRows"
                (input)="updateData({ maxRows: +$any($event.target).value })"
              />
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="confirmBeforeDelete"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.data.confirmBeforeDelete"
                (change)="updateData({ confirmBeforeDelete: $any($event.target).checked })"
              />
              <label for="confirmBeforeDelete" class="text-sm text-slate-300">Confirm before deleting data</label>
            </div>
          </div>
        }

        @if (activeTab() === "connections") {
          <div class="space-y-6">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Connection Timeout (seconds)</label>
              <input
                type="number"
                min="5"
                max="300"
                class="w-32 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                [value]="currentSettings.connections.connectionTimeout"
                (input)="updateConnections({ connectionTimeout: +$any($event.target).value })"
              />
            </div>

            <div>
              <label class="block text-sm font-medium text-slate-300 mb-3">Max Concurrent Connections</label>
              <input
                type="number"
                min="1"
                max="20"
                class="w-32 bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-emerald-500"
                [value]="currentSettings.connections.maxConcurrent"
                (input)="updateConnections({ maxConcurrent: +$any($event.target).value })"
              />
            </div>

            <div class="flex items-center gap-3">
              <input
                type="checkbox"
                id="autoReconnect"
                class="rounded bg-slate-800 border-slate-600 text-emerald-500 focus:ring-emerald-500 focus:ring-offset-0"
                [checked]="currentSettings.connections.autoReconnect"
                (change)="updateConnections({ autoReconnect: $any($event.target).checked })"
              />
              <label for="autoReconnect" class="text-sm text-slate-300">Auto-reconnect on connection loss</label>
            </div>
          </div>
        }
      </div>
    </div>

    <div class="px-6 py-4 border-t border-slate-700 flex justify-between">
      <button
        class="px-4 py-2 text-sm text-slate-400 hover:text-slate-200 transition-colors"
        (click)="resetToDefaults()"
      >
        Reset to Defaults
      </button>
      <div class="flex gap-3">
        <button
          class="px-4 py-2 text-sm text-slate-300 hover:text-slate-100 transition-colors"
          (click)="cancelSettings()"
        >
          Cancel
        </button>
        <button
          class="px-4 py-2 text-sm bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg transition-colors"
          (click)="saveSettings()"
        >
          Save
        </button>
      </div>
    </div>
  </div>
</div>
