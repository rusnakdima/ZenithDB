<app-modal
  [open]="open()"
  title="Create Collection"
  size="md"
  [closeOnBackdrop]="false"
  [closeOnEscape]="true"
  [showCloseButton]="true"
  (closed)="onClosed()"
>
  <form class="space-y-5">
    <div>
      <label for="collection-name" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Collection Name
      </label>
      <input
        id="collection-name"
        type="text"
        [value]="collectionName()"
        (input)="onNameInput($event)"
        placeholder="e.g., users, products, orders"
        class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
      />
    </div>

    <div>
      <label for="collection-type" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">
        Collection Type
      </label>
      <select
        id="collection-type"
        [value]="collectionType()"
        (change)="onTypeChange($event)"
        class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent"
      >
        @for (type of collectionTypes; track type.value) {
          <option [value]="type.value">{{ type.label }}</option>
        }
      </select>
    </div>
  </form>

  <div modal-footer class="flex w-full gap-3">
    <button
      type="button"
      (click)="onCancel()"
      class="flex-1 px-4 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 rounded-lg transition-colors"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onCreate()"
      [disabled]="!isValid"
      [class.opacity-50]="!isValid"
      [class.cursor-not-allowed]="!isValid"
      class="flex-1 px-4 py-2 text-sm font-medium text-white bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg transition-colors"
    >
      Create Collection
    </button>
  </div>
</app-modal>
