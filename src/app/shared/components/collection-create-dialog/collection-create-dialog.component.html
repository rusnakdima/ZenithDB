<app-modal
  [open]="open()"
  title="Create Collection"
  size="md"
  [closeOnBackdrop]="false"
  [closeOnEscape]="true"
  [showCloseButton]="true"
  (closed)="onClosed()"
>
  <form class="space-y-5">
    <div>
      <label
        for="collection-name"
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
      >
        Collection Name
      </label>
      <input
        id="collection-name"
        type="text"
        [value]="collectionName()"
        (input)="onNameInput($event)"
        placeholder="e.g., users, products, orders"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-transparent focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-white"
      />
    </div>

    <div>
      <label
        for="collection-type"
        class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-300"
      >
        Collection Type
      </label>
      <select
        id="collection-type"
        [value]="collectionType()"
        (change)="onTypeChange($event)"
        class="w-full rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-900 focus:border-transparent focus:ring-2 focus:ring-emerald-500 focus:outline-none dark:border-gray-600 dark:bg-gray-700 dark:text-white"
      >
        @for (type of collectionTypes; track type.value) {
          <option [value]="type.value">{{ type.label }}</option>
        }
      </select>
    </div>
  </form>

  <div modal-footer class="flex w-full gap-3">
    <button
      type="button"
      (click)="onCancel()"
      class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"
    >
      Cancel
    </button>
    <button
      type="button"
      (click)="onCreate()"
      [disabled]="!isValid"
      [class.opacity-50]="!isValid"
      [class.cursor-not-allowed]="!isValid"
      class="flex-1 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-emerald-700 disabled:cursor-not-allowed disabled:opacity-50"
    >
      Create Collection
    </button>
  </div>
</app-modal>
