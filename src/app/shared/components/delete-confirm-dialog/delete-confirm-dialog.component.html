<app-confirm-dialog
  [open]="open()"
  title="Delete {{ itemType() }}"
  [message]="'This action cannot be undone. This will permanently delete the ' + itemType() + ' named \'' + itemName() + '\'.'"
  icon="danger"
  [confirmLabel]="'Delete ' + itemType()"
  cancelLabel="Cancel"
  confirmVariant="danger"
  (confirmed)="onDeleted()"
  (cancelled)="onCancelled()"
>
  <div class="mt-4 space-y-3">
    <p class="text-sm text-gray-500 dark:text-gray-400">
      Type <span class="font-mono font-semibold text-red-500">{{ itemName() }}</span> to confirm
    </p>
    <input
      type="text"
      [value]="enteredName()"
      (input)="onNameInput($event)"
      placeholder="Enter name to confirm"
      class="w-full px-3 py-2 text-sm border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:border-transparent"
    />
  </div>
</app-confirm-dialog>
