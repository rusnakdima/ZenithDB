@if (isOpen()) {
  <div
    class="command-palette-backdrop fixed inset-0 z-[9999] flex items-start justify-center bg-black/60 pt-[15vh] backdrop-blur-sm"
    (click)="onBackdropClick($event)"
  >
    <div
      class="w-full max-w-xl overflow-hidden rounded-2xl border border-[var(--accent)] bg-transparent shadow-2xl backdrop-blur-md"
      style="max-height: 60vh; display: flex; flex-direction: column"
    >
      <div class="flex items-center gap-3 border-b border-[var(--accent)] px-4 py-3">
        <svg
          class="h-5 w-5 text-[var(--text-dim)]"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
          />
        </svg>
        <input
          type="text"
          [value]="query()"
          (input)="onQueryChange($any($event.target).value)"
          placeholder="Search commands..."
          class="flex-1 bg-transparent text-sm text-[var(--text-main)] placeholder-[var(--text-dim)] outline-none"
        />
        <kbd class="rounded bg-transparent px-2 py-1 text-xs text-[var(--text-dim)]">Esc</kbd>
      </div>

      <div class="flex-1 overflow-y-auto">
        @for (command of filteredCommands(); track command.id) {
          @if (isHeader(command)) {
            <div
              class="bg-transparent px-4 py-2 text-xs font-semibold tracking-wider text-[var(--text-dim)] uppercase"
            >
              {{ getCategoryLabel(command.category) }}
            </div>
          } @else {
            <button
              type="button"
              (click)="execute(command)"
              class="flex w-full items-center justify-between px-4 py-2.5 text-left transition-colors hover:bg-[var(--accent)]/10"
              [class.bg-transparent]="isSelected(command)"
              [class.text-[var(--accent)]]="isSelected(command)"
            >
              <div class="flex items-center gap-3">
                <div class="flex h-6 w-6 items-center justify-center rounded bg-transparent">
                  @switch (command.category) {
                    @case ("navigation") {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"
                        />
                      </svg>
                    }
                    @case ("action") {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M13 10V3L4 14h7v7l9-11h-7z"
                        />
                      </svg>
                    }
                    @default {
                      <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path
                          stroke-linecap="round"
                          stroke-linejoin="round"
                          stroke-width="2"
                          d="M13 10V3L4 14h7v7l9-11h-7z"
                        />
                      </svg>
                    }
                  }
                </div>
                <span
                  class="text-sm text-[var(--text-main)]"
                  [innerHTML]="highlightMatch(command.label)"
                ></span>
              </div>
              @if (command.shortcut) {
                <kbd class="rounded bg-transparent px-2 py-1 text-xs text-[var(--text-dim)]">{{
                  command.shortcut
                }}</kbd>
              }
            </button>
          }
        }

        @if (filteredCommands().length === 0) {
          <div class="px-4 py-8 text-center text-[var(--text-dim)]">
            <p class="text-sm">No commands found</p>
          </div>
        }
      </div>

      <div
        class="flex items-center justify-between border-t border-[var(--accent)] px-4 py-2 text-xs text-[var(--text-dim)]"
      >
        <div class="flex items-center gap-4">
          <span class="flex items-center gap-1">
            <kbd class="rounded bg-transparent px-1.5 py-0.5">↑</kbd>
            <kbd class="rounded bg-transparent px-1.5 py-0.5">↓</kbd>
            <span>navigate</span>
          </span>
          <span class="flex items-center gap-1">
            <kbd class="rounded bg-transparent px-1.5 py-0.5">Enter</kbd>
            <span>select</span>
          </span>
        </div>
        <span class="flex items-center gap-1">
          <kbd class="rounded bg-transparent px-1.5 py-0.5">Ctrl+K</kbd>
          <span>or</span>
          <kbd class="rounded bg-transparent px-1.5 py-0.5">Ctrl+P</kbd>
          <span>open</span>
        </span>
      </div>
    </div>
  </div>
}
