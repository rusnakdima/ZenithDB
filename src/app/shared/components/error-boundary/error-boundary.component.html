@if (hasError) {
  <div class="flex flex-col items-center justify-center p-8 text-center">
    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-red-500/10">
      <svg class="h-6 w-6 text-red-500" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
      </svg>
    </div>

    <h3 class="mt-4 text-lg font-semibold text-gray-900 dark:text-white">{{ fallbackTitle() }}</h3>
    <p class="mt-2 text-sm text-gray-500 dark:text-gray-400">{{ fallbackMessage() }}</p>
    @if (errorMessage) {
      <p class="mt-1 text-xs text-red-500">{{ errorMessage }}</p>
    }

    <button
      type="button"
      (click)="onReset()"
      class="mt-6 px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors"
    >
      Try again
    </button>
  </div>
} @else {
  <ng-content></ng-content>
}
