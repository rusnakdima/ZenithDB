@if (hasError()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
    <div
      class="mx-4 w-full max-w-md rounded-xl border shadow-2xl"
      style="background-color: var(--bg-elevated); border-color: var(--border-subtle)"
    >
      <div class="flex flex-col items-center p-6 text-center">
        <div
          class="flex h-14 w-14 items-center justify-center rounded-full bg-red-100 dark:bg-red-900/30"
        >
          <svg
            class="h-7 w-7 text-red-600 dark:text-red-400"
            viewBox="0 0 20 20"
            fill="currentColor"
          >
            <path
              fill-rule="evenodd"
              d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <h3 class="mt-4 text-lg font-semibold" style="color: var(--text-main)">
          Something went wrong
        </h3>

        <p class="mt-2 text-sm" style="color: var(--text-muted)">
          {{ errorMessage() }}
        </p>
      </div>

      <div class="flex gap-3 border-t px-6 py-4" style="border-color: var(--border-subtle)">
        <button
          type="button"
          (click)="dismiss()"
          class="flex-1 rounded-lg px-4 py-2 text-sm font-medium transition-colors"
          style="
            background-color: var(--bg-secondary);
            color: var(--text-main);
            border: 1px solid var(--border-subtle);
          "
          onmouseover="this.style.backgroundColor = 'var(--bg-tertiary)'"
          onmouseout="this.style.backgroundColor = 'var(--bg-secondary)'"
        >
          Dismiss
        </button>
        <button
          type="button"
          (click)="retry()"
          class="flex-1 rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-700"
        >
          Retry
        </button>
      </div>
    </div>
  </div>
}
