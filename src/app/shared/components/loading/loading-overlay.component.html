@if (loadingService.isLoading()) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div class="flex flex-col items-center gap-4">
      <div class="relative h-16 w-16">
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-emerald-500/20"></div>
        <div class="absolute inset-0 animate-spin rounded-full border-4 border-transparent border-t-emerald-500" style="animation-delay: -0.15s"></div>
        <div class="absolute inset-3 animate-spin rounded-full border-4 border-transparent border-t-emerald-300/50" style="animation-delay: -0.3s"></div>
      </div>
      @if (loadingService.loadingMessage()) {
        <p class="text-emerald-400 text-sm font-medium">{{ loadingService.loadingMessage() }}</p>
      }
    </div>
  </div>
}
