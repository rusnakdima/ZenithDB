@if (loadingService.isLoading()) {
  <app-modal
    [open]="true"
    [closeOnBackdrop]="false"
    [closeOnEscape]="false"
    [showCloseButton]="false"
    title=""
    size="sm"
  >
    <div class="flex flex-col items-center gap-4 py-4">
      <div
        class="h-16 w-16 animate-spin rounded-full border-4 border-[var(--border-subtle)] border-t-[var(--border-subtle)]"
      ></div>
      @if (loadingService.loadingMessage()) {
        <p class="text-sm font-medium text-[var(--accent)]">
          {{ loadingService.loadingMessage() }}
        </p>
      }
    </div>
  </app-modal>
}
