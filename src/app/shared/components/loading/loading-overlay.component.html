@if (loadingService.isLoading()) {
  <app-modal
    [open]="true"
    [closeOnBackdrop]="false"
    [closeOnEscape]="false"
    [showCloseButton]="false"
    title=""
    size="sm"
  >
    <div class="flex flex-col items-center gap-4 py-4">
      <div class="relative h-16 w-16">
        <div
          class="absolute inset-0 animate-spin rounded-full border-4 border-emerald-500/20"
        ></div>
        <div
          class="absolute inset-0 animate-spin rounded-full border-4 border-transparent border-t-emerald-500"
          style="animation-delay: -0.15s"
        ></div>
        <div
          class="absolute inset-3 animate-spin rounded-full border-4 border-transparent border-t-emerald-300/50"
          style="animation-delay: -0.3s"
        ></div>
      </div>
      @if (loadingService.loadingMessage()) {
        <p class="text-sm font-medium text-emerald-400">{{ loadingService.loadingMessage() }}</p>
      }
    </div>
  </app-modal>
}
