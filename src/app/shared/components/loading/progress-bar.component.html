<div class="relative h-2 w-full overflow-hidden rounded-full bg-slate-700">
  <div
    class="h-full rounded-full transition-all duration-300 ease-out"
    [class]="color"
    [class]="barClasses"
    [style.width.%]="clampedValue"
  ></div>
  @if (showText) {
    <span
      class="absolute inset-0 flex items-center justify-center text-xs font-medium text-white drop-shadow-lg"
    >
      {{ clampedValue }}%
    </span>
  }
</div>
