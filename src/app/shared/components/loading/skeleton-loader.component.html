@for (item of items; track $index) {
  @switch (variant) {
    @case ("text") {
      <div class="h-4 w-3/4 animate-pulse rounded bg-[var(--bg-elevated)]"></div>
    }
    @case ("card") {
      <div class="animate-pulse rounded-xl bg-[var(--bg-elevated)]">
        <div class="h-32 w-full rounded-t-xl bg-[var(--bg-card)]"></div>
        <div class="space-y-2 p-4">
          <div class="h-4 w-2/3 rounded bg-[var(--bg-card)]"></div>
          <div class="h-3 w-1/2 rounded bg-[var(--bg-card)]"></div>
        </div>
      </div>
    }
    @case ("table-row") {
      <div class="flex items-center gap-4 py-3">
        @for (col of columnsArray; track col) {
          <div class="h-4 flex-1 animate-pulse rounded bg-[var(--bg-elevated)]"></div>
        }
      </div>
    }
    @case ("avatar") {
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 animate-pulse rounded-full bg-[var(--bg-elevated)]"></div>
        <div class="space-y-2">
          <div class="h-4 w-32 animate-pulse rounded bg-[var(--bg-elevated)]"></div>
          <div class="h-3 w-24 animate-pulse rounded bg-[var(--bg-elevated)]"></div>
        </div>
      </div>
    }
    @case ("button") {
      <div class="h-10 w-24 animate-pulse rounded-lg bg-[var(--bg-elevated)]"></div>
    }
    @default {
      <div class="h-4 animate-pulse rounded bg-[var(--bg-elevated)]"></div>
    }
  }
}
