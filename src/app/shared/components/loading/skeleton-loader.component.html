@for (item of items; track $index) {
  @switch (variant) {
    @case ("text") {
      <div class="h-4 w-3/4 rounded bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
    }
    @case ("card") {
      <div class="rounded-xl bg-gray-200 dark:bg-gray-700 animate-pulse">
        <div class="h-32 w-full rounded-t-xl bg-gray-300 dark:bg-gray-600"></div>
        <div class="p-4 space-y-2">
          <div class="h-4 w-2/3 rounded bg-gray-300 dark:bg-gray-600"></div>
          <div class="h-3 w-1/2 rounded bg-gray-300 dark:bg-gray-600"></div>
        </div>
      </div>
    }
    @case ("table-row") {
      <div class="flex items-center gap-4 py-3">
        @for (col of columnsArray; track col) {
          <div class="h-4 flex-1 rounded bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
        }
      </div>
    }
    @case ("avatar") {
      <div class="flex items-center gap-3">
        <div class="h-10 w-10 rounded-full bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
        <div class="space-y-2">
          <div class="h-4 w-32 rounded bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
          <div class="h-3 w-24 rounded bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
        </div>
      </div>
    }
    @case ("button") {
      <div class="h-10 w-24 rounded-lg bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
    }
    @default {
      <div class="h-4 rounded bg-gray-200 dark:bg-gray-700 animate-pulse"></div>
    }
  }
}
