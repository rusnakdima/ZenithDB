@if (error()) {
  <div
    class="pointer-events-none fixed top-0 right-0 left-0 z-50 flex items-center justify-center p-4"
  >
    <div
      class="pointer-events-auto w-full max-w-2xl rounded-lg border border-red-800 bg-red-950/95 shadow-xl backdrop-blur-sm"
    >
      <div class="flex items-start gap-3 p-4">
        <div class="mt-0.5 flex-shrink-0">
          <svg class="h-5 w-5 text-red-400" viewBox="0 0 20 20" fill="currentColor">
            <path
              fill-rule="evenodd"
              d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
              clip-rule="evenodd"
            />
          </svg>
        </div>

        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="text-sm font-medium text-red-200">Error</span>
            <span class="text-xs text-red-400/60">•</span>
            <span class="text-xs text-red-400/60">{{ error().code }}</span>
          </div>
          <p class="mt-1 text-sm text-red-100">{{ error().userMessage }}</p>
          @if (error().details) {
            <p class="mt-1 text-xs text-red-300/70">{{ error().details }}</p>
          }
          @if (!isOnline) {
            <p class="mt-2 text-xs text-amber-300">You appear to be offline</p>
          }
        </div>

        <div class="flex flex-shrink-0 items-center gap-2">
          @if (error().retryable) {
            <button
              type="button"
              (click)="onRetry()"
              class="rounded border border-red-700/50 bg-red-900/50 px-3 py-1.5 text-xs font-medium text-red-100 transition-colors hover:bg-red-900/70"
            >
              Retry
            </button>
          }
          <button
            type="button"
            (click)="onDismiss()"
            class="rounded p-1.5 text-red-300 transition-colors hover:bg-red-900/50 hover:text-red-100"
            aria-label="Dismiss"
          >
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor">
              <path
                fill-rule="evenodd"
                d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
}
