<app-modal
  [open]="open()"
  [title]="title()"
  size="sm"
  [closeOnBackdrop]="true"
  [closeOnEscape]="true"
  [showCloseButton]="false"
  (closed)="onCancelled()"
>
  <div class="flex flex-col items-center text-center">
    <div
      class="flex h-12 w-12 items-center justify-center rounded-full"
      [class]="getBgColorClass()"
    >
      <svg class="h-6 w-6" [class]="getIconColorClass()" viewBox="0 0 20 20" fill="currentColor">
        <path
          fill-rule="evenodd"
          d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd"
        />
      </svg>
    </div>

    <p class="mt-4 text-sm text-gray-600 dark:text-gray-300">{{ message() }}</p>
  </div>

  <div modal-footer class="flex w-full gap-3">
    <button
      type="button"
      (click)="onCancelled()"
      class="flex-1 rounded-lg bg-gray-100 px-4 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-200 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"
    >
      {{ cancelLabel() }}
    </button>
    <button
      type="button"
      (click)="onConfirmed()"
      [class]="
        confirmVariant() === 'danger'
          ? 'bg-red-600 hover:bg-red-700'
          : 'bg-emerald-600 hover:bg-emerald-700'
      "
      class="flex-1 rounded-lg px-4 py-2 text-sm font-medium text-white transition-colors"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>
