<label
  class="custom-checkbox group flex cursor-pointer items-center gap-3 select-none"
  [class.checkbox-accent]="variant() === 'accent'"
  [class.checkbox-gray]="variant() === 'gray'"
  [class.disabled]="disabled()"
  [attr.for]="inputId"
>
  <input
    type="checkbox"
    [id]="inputId"
    [checked]="checked()"
    [disabled]="disabled()"
    (change)="onChange($event.target.checked)"
    class="peer sr-only"
  />
  <div class="checkbox-box">
    <div class="checkbox-inner">
      <svg class="checkmark" viewBox="0 0 14 12" fill="none">
        <path
          d="M1 6L5 10L13 2"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>
  </div>
  @if (label()) {
    <span class="checkbox-label">
      {{ label() }}
    </span>
  }
</label>
