<label
  class="flex items-center gap-3 cursor-pointer group select-none"
  [class.opacity-50]="disabled()"
  [class.cursor-not-allowed]="disabled()"
>
  <div class="relative">
    <mat-checkbox
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="onChange($event.checked)"
      color="primary"
      class="custom-checkbox"
      disableRipple
    >
    </mat-checkbox>
  </div>
  @if (label()) {
    <span class="text-sm text-slate-300 dark:text-slate-200 group-hover:text-white transition-colors duration-150">
      {{ label() }}
    </span>
  }
</label>
