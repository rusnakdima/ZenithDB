<label
  class="group flex cursor-pointer items-center gap-3 select-none"
  [class.opacity-50]="disabled()"
  [class.cursor-not-allowed]="disabled()"
  [attr.for]="id()"
>
  <div class="relative">
    <mat-checkbox
      [checked]="checked()"
      [disabled]="disabled()"
      (change)="onChange($event.checked)"
      [color]="variant() === 'emerald' ? 'primary' : 'warn'"
      class="custom-checkbox"
      [class.checkbox-emerald]="variant() === 'emerald'"
      [class.checkbox-gray]="variant() === 'gray'"
      disableRipple
    >
    </mat-checkbox>
  </div>
  @if (label()) {
    <span
      class="text-sm text-slate-300 transition-colors duration-150 group-hover:text-white dark:text-slate-200"
    >
      {{ label() }}
    </span>
  }
</label>
