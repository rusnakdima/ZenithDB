@if (config(); as cfg) {
  @switch (variant()) {
    @case ("icon") {
      <span class="type-icon" [class]="cfg.colorClass">{{ cfg.icon }}</span>
    }
    @case ("class") {
      <span [class]="cfg.colorClass">{{ dataType() }}</span>
    }
    @case ("full") {
      <span class="type-icon" [class]="cfg.colorClass">{{ cfg.icon }}</span>
      <span [class]="cfg.colorClass">{{ dataType() }}</span>
    }
  }
}
