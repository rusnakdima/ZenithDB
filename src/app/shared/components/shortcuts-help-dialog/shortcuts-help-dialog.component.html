<app-modal
  [open]="isOpen"
  title="Keyboard Shortcuts"
  size="lg"
  [closeOnBackdrop]="true"
  [closeOnEscape]="true"
  (closed)="onClose()"
>
  <div class="grid grid-cols-2 gap-6">
    <div>
      <h3 class="mb-3 text-sm font-semibold text-[var(--text-muted)] uppercase">Navigation</h3>
      <div class="space-y-2">
        @for (shortcut of navigationShortcuts; track shortcut.key) {
          <div class="flex items-center justify-between text-sm">
            <span class="text-[var(--text-main)]">{{ shortcut.desc }}</span>
            <app-kbd-badge [shortcut]="shortcut.key"></app-kbd-badge>
          </div>
        }
      </div>
    </div>

    <div>
      <h3 class="mb-3 text-sm font-semibold text-[var(--text-muted)] uppercase">Editor</h3>
      <div class="space-y-2">
        @for (shortcut of editorShortcuts; track shortcut.key) {
          <div class="flex items-center justify-between text-sm">
            <span class="text-[var(--text-main)]">{{ shortcut.desc }}</span>
            <app-kbd-badge [shortcut]="shortcut.key"></app-kbd-badge>
          </div>
        }
      </div>
    </div>

    <div class="col-span-2">
      <h3 class="mb-3 text-sm font-semibold text-[var(--text-muted)] uppercase">
        Table Navigation
      </h3>
      <div class="grid grid-cols-2 gap-4">
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Navigate Cells</span>
          <app-kbd-badge shortcut="↑ ↓ ← →"></app-kbd-badge>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Edit Cell / Confirm</span>
          <app-kbd-badge shortcut="Enter"></app-kbd-badge>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Next Cell</span>
          <app-kbd-badge shortcut="Tab"></app-kbd-badge>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Cancel Edit</span>
          <app-kbd-badge shortcut="Esc"></app-kbd-badge>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Delete Selected Rows</span>
          <app-kbd-badge shortcut="Shift+Del"></app-kbd-badge>
        </div>
        <div class="flex items-center justify-between text-sm">
          <span class="text-[var(--text-main)]">Select All</span>
          <app-kbd-badge shortcut="Ctrl+A"></app-kbd-badge>
        </div>
      </div>
    </div>
  </div>
</app-modal>
