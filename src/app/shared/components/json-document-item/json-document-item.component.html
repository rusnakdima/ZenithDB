<article
  class="mb-4 overflow-hidden rounded-lg border border-[var(--border-visible)] bg-transparent"
>
  <header
    class="flex items-center justify-between border-b border-[var(--border-subtle)] bg-transparent px-4 py-2"
  >
    <span class="mono text-sm text-[var(--text-dim)]">Document {{ docIndex() + 1 }}</span>
    <div class="flex items-center gap-1">
      <button
        class="flex items-center gap-1 rounded px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        title="Copy JSON"
        (click)="copyRowJson()"
      >
        <mat-icon fontIcon="content_copy" class="h-4! w-3! text-xs!" />
      </button>
      <button
        class="flex items-center gap-1 rounded px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        (click)="openInspector()"
      >
        <mat-icon fontIcon="visibility" class="h-4! w-3! text-xs!" />
        Inspect
      </button>
    </div>
  </header>
  <div class="json-body overflow-x-auto p-4">
    <div class="min-w-max">
      @for (line of highlightedLines(); track line.num) {
        <div class="json-line mono flex text-sm leading-relaxed hover:bg-[var(--bg-elevated)]">
          <span
            class="json-line-num w-10 flex-shrink-0 pr-4 text-right text-xs text-[var(--text-muted)] select-none"
            >{{ line.num }}</span
          >
          <span class="json-line-content" [innerHTML]="line.html"></span>
        </div>
      }
    </div>
  </div>
</article>
