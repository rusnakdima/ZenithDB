<div
  class="flex flex-col items-center justify-center rounded-xl border border-[var(--border-subtle)] bg-[var(--bg-elevated)] p-12 text-center"
>
  <div
    class="mb-4 flex h-16 w-16 items-center justify-center rounded-xl text-2xl"
    style="background-color: var(--bg-card); border: 1px solid var(--border-color)"
  >
    <mat-icon [fontIcon]="icon" class="h-8 w-8 min-w-8 text-3xl! text-[var(--text-muted)]" />
  </div>
  <h3 class="mb-2 text-lg font-semibold text-[var(--text-main)]">{{ title }}</h3>
  @if (message) {
    <p class="mb-6 text-sm text-[var(--text-dim)]">{{ message }}</p>
  }
  @if (actionLabel) {
    <button class="btn-accent flex items-center gap-2" (click)="action.emit()">
      <mat-icon [fontIcon]="actionIcon" class="h-5 w-5 min-w-5 text-xl!" />
      {{ actionLabel }}
    </button>
  }
</div>
