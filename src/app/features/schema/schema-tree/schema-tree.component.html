<div class="flex h-full flex-col border-r border-slate-800 bg-slate-900">
  <div class="flex items-center justify-between border-b border-slate-800 px-4 py-3">
    <h2 class="text-sm font-semibold tracking-wider text-slate-400 uppercase">Collections</h2>
    <button (click)="loadCollections()" class="rounded p-1 transition-colors hover:bg-slate-800">
      <svg
        class="h-4 w-4 text-slate-500 hover:text-slate-300"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
        ></path>
      </svg>
    </button>
  </div>

  @if (loading()) {
    <div class="flex items-center justify-center py-8">
      <div
        class="h-6 w-6 animate-spin rounded-full border-2 border-emerald-500 border-t-transparent"
      ></div>
    </div>
  } @else if (error()) {
    <div class="px-4 py-3 text-sm text-red-400">{{ error() }}</div>
  } @else {
    <nav class="flex-1 space-y-1 overflow-y-auto p-2">
      @for (col of collections(); track col.name) {
        <div>
          <div
            class="group flex cursor-pointer items-center gap-2 rounded-lg px-3 py-2 text-slate-300 transition-colors hover:bg-slate-800"
            (click)="toggleExpand(col.name)"
          >
            <svg
              class="h-4 w-4 flex-shrink-0 text-slate-600 group-hover:text-slate-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4"
              ></path>
            </svg>
            <span class="flex-1 text-sm">{{ col.name }}</span>
            <span class="text-xs text-slate-600">{{ col.count }}</span>
            <svg
              class="h-3 w-3 text-slate-600 transition-transform"
              [class.rotate-90]="isExpanded(col.name)"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 5l7 7-7 7"
              ></path>
            </svg>
          </div>
          @if (isExpanded(col.name)) {
            <div class="mt-1 ml-4 space-y-1 border-l border-slate-800 pl-3">
              <a
                [routerLink]="['/data', col.name]"
                class="flex items-center gap-2 rounded px-3 py-1.5 text-sm text-slate-500 transition-colors hover:bg-slate-800 hover:text-slate-300"
              >
                <svg
                  class="h-3 w-3 flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"
                  ></path>
                </svg>
                Browse Data
              </a>
              <a
                [routerLink]="['/schema', col.name]"
                class="flex items-center gap-2 rounded px-3 py-1.5 text-sm text-slate-500 transition-colors hover:bg-slate-800 hover:text-slate-300"
              >
                <svg
                  class="h-3 w-3 flex-shrink-0"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
                  ></path>
                </svg>
                Details
              </a>
            </div>
          }
        </div>
      }
    </nav>
  }
</div>
