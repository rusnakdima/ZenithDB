<div class="relative rounded-lg border border-[var(--border-color)] bg-slate-800/30 p-3">
  <!-- Connector Line -->
  @if (isNested) {
    <div
      class="absolute top-0 bottom-0 -left-4 w-4 rounded-tl-lg border-t-2 border-l-2 border-t-slate-600 border-l-slate-600"
    ></div>
  }

  <!-- Group Header -->
  <div class="mb-3 flex items-center gap-3 border-b border-[var(--border-color)] pb-2">
    <span class="text-xs tracking-wide text-[var(--text-dim)] uppercase">Match</span>

    <div class="flex items-center gap-1 rounded bg-slate-700 p-0.5">
      <button
        type="button"
        class="rounded px-3 py-1 text-xs transition-colors"
        [class.bg-[var(--accent)]]="group.operator === 'and'"
        [class.text-white]="group.operator === 'and'"
        [class.text-[var(--text-dim)]]="group.operator !== 'and'"
        [class.hover:text-white]="group.operator !== 'and'"
        (click)="setOperator('and')"
      >
        ALL
      </button>
      <button
        type="button"
        class="rounded px-3 py-1 text-xs transition-colors"
        [class.bg-[var(--color-warning)]]="group.operator === 'or'"
        [class.text-white]="group.operator === 'or'"
        [class.text-[var(--text-dim)]]="group.operator !== 'or'"
        [class.hover:text-white]="group.operator !== 'or'"
        (click)="setOperator('or')"
      >
        ANY
      </button>
    </div>

    <span class="text-xs text-[var(--text-muted)]"> of the following conditions: </span>

    @if (!isRoot) {
      <button
        type="button"
        class="ml-auto p-1 text-[var(--text-muted)] hover:text-[var(--color-error)]"
        (click)="onRemoveGroup()"
        title="Remove group"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    }
  </div>

  <!-- Conditions -->
  <div class="space-y-2">
    @for (condition of group.conditions; track condition.id) {
      <app-query-condition
        [condition]="condition"
        [collectionName]="collectionName"
        (conditionChange)="onConditionChange($event, condition.id)"
        (remove)="onRemoveCondition(condition.id)"
      />
    }
  </div>

  <!-- Add Condition Button -->
  <button
    type="button"
    class="mt-3 flex items-center gap-2 text-sm text-[var(--text-dim)] transition-colors hover:text-[var(--accent)]"
    (click)="addCondition()"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
    </svg>
    Add condition
  </button>

  <!-- Nested Groups -->
  @if (group.groups && group.groups!.length > 0) {
    <div class="mt-4 space-y-3 border-l-2 border-[var(--border-color)] pl-4">
      @for (subGroup of group.groups!; track subGroup.id) {
        <app-query-group
          [group]="subGroup"
          [collectionName]="collectionName"
          [isNested]="true"
          (groupChange)="onSubGroupChange($event, subGroup.id)"
          (removeGroup)="onRemoveSubGroup(subGroup.id)"
        />
      }
    </div>
  }

  <!-- Add Nested Group Button -->
  <button
    type="button"
    class="mt-3 flex items-center gap-2 text-sm text-[var(--text-muted)] transition-colors hover:text-[var(--color-warning)]"
    (click)="addNestedGroup()"
  >
    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"
      />
    </svg>
    Add condition group
  </button>
</div>
