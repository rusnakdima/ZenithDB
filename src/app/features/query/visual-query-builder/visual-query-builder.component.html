<div class="flex h-full flex-col rounded-lg border border-slate-700 bg-slate-900">
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-slate-700 px-4 py-3">
    <div class="flex items-center gap-3">
      <h3 class="text-sm font-medium text-slate-200">Visual Query Builder</h3>
      @if (collectionName) {
        <span class="rounded bg-[var(--accent-muted)] px-2 py-1 text-xs text-[var(--accent)]">
          {{ collectionName }}
        </span>
      }
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded px-2 py-1 text-xs text-slate-400 transition-colors hover:bg-slate-700 hover:text-white"
        (click)="clearAll()"
      >
        Clear All
      </button>
    </div>
  </div>

  <!-- Query Builder Body -->
  <div class="flex-1 space-y-4 overflow-y-auto p-4">
    <!-- Conditions Group -->
    <app-query-group
      [group]="rootGroup()"
      [collectionName]="collectionName"
      [isNested]="false"
      [isRoot]="true"
      (groupChange)="onGroupChange($event)"
    />

    <!-- Sort Section -->
    <div class="rounded-lg border border-slate-600 bg-slate-800/30 p-3">
      <div class="mb-3 flex items-center gap-2">
        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"
          />
        </svg>
        <span class="text-xs tracking-wide text-slate-400 uppercase">Sort</span>
      </div>

      @if (sorts().length > 0) {
        <div class="space-y-2">
          @for (sort of sorts(); track sort.field; let i = $index) {
            <div class="flex items-center gap-2">
              <select
                class="rounded border border-slate-600 bg-slate-700 px-2 py-1.5 text-sm text-slate-200 focus:border-[var(--accent)] focus:outline-none"
                [ngModel]="sort.field"
                (ngModelChange)="updateSortField(i, $event)"
              >
                <option value="">Field...</option>
                @for (field of fields(); track field.name) {
                  <option [value]="field.name">{{ field.name }}</option>
                }
              </select>

              <button
                type="button"
                class="rounded px-3 py-1.5 text-xs transition-colors"
                [class.bg-slate-600]="sort.direction === 'asc'"
                [class.text-white]="sort.direction === 'asc'"
                [class.text-slate-400]="sort.direction !== 'asc'"
                (click)="toggleSortDirection(i)"
              >
                {{ sort.direction === "asc" ? "↑ ASC" : "↓ DESC" }}
              </button>

              <button
                type="button"
                class="p-1 text-slate-500 hover:text-red-400"
                (click)="removeSort(i)"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
              </button>
            </div>
          }
        </div>
      }

      <button
        type="button"
        class="mt-2 flex items-center gap-2 text-sm text-slate-400 transition-colors hover:text-[var(--accent)]"
        (click)="addSort()"
      >
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>
        Add sort field
      </button>
    </div>

    <!-- Limit Section -->
    <div class="rounded-lg border border-slate-600 bg-slate-800/30 p-3">
      <div class="mb-3 flex items-center gap-2">
        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 10h16M4 14h16M4 18h16"
          />
        </svg>
        <span class="text-xs tracking-wide text-slate-400 uppercase">Limit</span>
      </div>

      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">Skip</label>
          <input
            type="number"
            class="w-20 rounded border border-slate-600 bg-slate-700 px-2 py-1.5 text-sm text-slate-200 focus:border-[var(--accent)] focus:outline-none"
            [ngModel]="skip()"
            (ngModelChange)="skip.set($event)"
            min="0"
          />
        </div>

        <div class="flex items-center gap-2">
          <label class="text-xs text-slate-400">Limit</label>
          <input
            type="number"
            class="w-20 rounded border border-slate-600 bg-slate-700 px-2 py-1.5 text-sm text-slate-200 focus:border-[var(--accent)] focus:outline-none"
            [ngModel]="limit()"
            (ngModelChange)="limit.set($event)"
            min="1"
          />
        </div>
      </div>
    </div>
  </div>

  <!-- Footer with Actions -->
  <div
    class="flex items-center justify-between border-t border-slate-700 bg-slate-800/50 px-4 py-3"
  >
    <div class="text-xs text-slate-500">
      @if (hasConditions()) {
        <span class="text-[var(--accent)]">{{ conditionCount() }} condition(s)</span>
      } @else {
        <span>No conditions</span>
      }
    </div>

    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded border border-slate-600 px-4 py-2 text-sm text-slate-300 transition-colors hover:bg-slate-700 hover:text-white"
        (click)="onCancel()"
      >
        Cancel
      </button>
      <button
        type="button"
        class="rounded bg-[var(--accent)] px-4 py-2 text-sm text-black transition-colors hover:bg-[var(--accent-hover)] disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="!hasConditions()"
        (click)="onApply()"
      >
        Apply Filter
      </button>
    </div>
  </div>
</div>
