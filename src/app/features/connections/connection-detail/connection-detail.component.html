<app-page-container>
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-[var(--text-main)]">
      {{ connectionName() || "Connection Details" }}
    </h1>
    <span
      class="rounded bg-[var(--bg-elevated)] px-3 py-1 text-sm font-medium text-[var(--text-dim)]"
    >
      {{ provider() }}
    </span>
  </div>

  <div class="glass-card p-6">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <div>
        <h3 class="mb-1 text-sm font-medium text-[var(--text-dim)]">Status</h3>
        <div class="flex items-center gap-2">
          <span
            class="h-2 w-2 rounded-full"
            [class.bg-green-500]="health()?.healthy"
            [class.bg-red-500]="!health()?.healthy"
          ></span>
          <span class="text-[var(--text-main)]">{{
            health()?.healthy ? "Connected" : "Disconnected"
          }}</span>
        </div>
      </div>

      @if (serverVersion()) {
        <div>
          <h3 class="mb-1 text-sm font-medium text-[var(--text-dim)]">Server Version</h3>
          <p class="text-[var(--text-main)]">{{ serverVersion() }}</p>
        </div>
      }

      @if (health()?.version) {
        <div>
          <h3 class="mb-1 text-sm font-medium text-[var(--text-dim)]">Provider Version</h3>
          <p class="text-[var(--text-main)]">{{ health()!.version }}</p>
        </div>
      }
    </div>
  </div>

  <div class="flex items-center gap-3">
    <a
      routerLink="/schema"
      class="rounded-xl border border-[var(--border-visible)] bg-[var(--bg-elevated)] px-4 py-3 text-sm font-medium text-[var(--text-main)] transition-colors hover:border-[var(--accent)] hover:bg-[var(--bg-card)]"
    >
      View Schema
    </a>
    <a
      routerLink="/data"
      class="rounded-xl border border-[var(--border-visible)] bg-[var(--bg-elevated)] px-4 py-3 text-sm font-medium text-[var(--text-main)] transition-colors hover:border-[var(--accent)] hover:bg-[var(--bg-card)]"
    >
      Browse Data
    </a>
    <button
      (click)="disconnect()"
      class="rounded-xl border border-red-900/50 bg-red-900/20 px-4 py-3 text-sm font-medium text-red-400 transition-colors hover:bg-red-900/30"
    >
      Disconnect
    </button>
  </div>
</app-page-container>
