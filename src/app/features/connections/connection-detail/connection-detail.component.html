<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white">{{ connectionName() || "Connection Details" }}</h1>
    <span class="rounded bg-neutral-800 px-3 py-1 text-sm font-medium text-neutral-400">
      {{ provider() }}
    </span>
  </div>

  <div class="rounded-xl border border-neutral-800 bg-neutral-900 p-6">
    <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
      <div>
        <h3 class="mb-1 text-sm font-medium text-neutral-400">Status</h3>
        <div class="flex items-center gap-2">
          <span
            class="h-2 w-2 rounded-full"
            [class.bg-emerald-500]="health()?.ok"
            [class.bg-red-500]="!health()?.ok"
          ></span>
          <span class="text-white">{{ health()?.ok ? "Connected" : "Disconnected" }}</span>
        </div>
      </div>

      @if (serverVersion()) {
        <div>
          <h3 class="mb-1 text-sm font-medium text-neutral-400">Server Version</h3>
          <p class="text-white">{{ serverVersion() }}</p>
        </div>
      }

      @if (health()?.version) {
        <div>
          <h3 class="mb-1 text-sm font-medium text-neutral-400">Provider Version</h3>
          <p class="text-white">{{ health()!.version }}</p>
        </div>
      }
    </div>
  </div>

  <div class="flex items-center gap-3">
    <a
      routerLink="/schema"
      class="rounded-lg bg-neutral-800 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-neutral-700"
    >
      View Schema
    </a>
    <a
      routerLink="/data"
      class="rounded-lg bg-neutral-800 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-neutral-700"
    >
      Browse Data
    </a>
    <button
      (click)="disconnect()"
      class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-500"
    >
      Disconnect
    </button>
  </div>
</div>
