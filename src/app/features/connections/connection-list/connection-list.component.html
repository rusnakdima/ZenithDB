<div class="space-y-6">
  <div class="flex items-center justify-between">
    <h1 class="text-2xl font-bold text-white">Connections</h1>
    <a
      routerLink="/connections/new"
      class="inline-flex items-center gap-2 rounded-lg bg-emerald-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-emerald-500"
    >
      <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      New Connection
    </a>
  </div>

  @if (connections.length === 0) {
    <div class="flex flex-col items-center justify-center py-16 text-center">
      <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-neutral-800">
        <svg class="h-8 w-8 text-neutral-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 10V3L4 14h7v7l9-11h-7z"
          />
        </svg>
      </div>
      <p class="mb-4 text-neutral-400">No connections yet</p>
      <a routerLink="/connections/new" class="text-emerald-400 hover:text-emerald-300"
        >Create your first connection</a
      >
    </div>
  } @else {
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
      @for (conn of connections; track conn.id) {
        <div
          class="rounded-xl border border-neutral-800 bg-neutral-900 p-5 transition-colors hover:border-neutral-700"
        >
          <div class="mb-3 flex items-start justify-between">
            <div>
              <h3 class="font-semibold text-white">{{ conn.name }}</h3>
              <span
                class="mt-1 inline-flex items-center rounded bg-neutral-800 px-2 py-0.5 text-xs font-medium text-neutral-400"
              >
                {{ conn.provider }}
              </span>
            </div>
            <span
              class="mt-2 h-2 w-2 rounded-full"
              [class.bg-emerald-500]="conn.status === 'connected'"
              [class.bg-neutral-600]="!conn.status || conn.status === 'disconnected'"
            ></span>
          </div>
          <div class="mt-4 flex items-center gap-2">
            <button
              (click)="connect(conn)"
              class="flex-1 rounded-lg bg-emerald-600 px-3 py-1.5 text-sm text-white transition-colors hover:bg-emerald-500"
            >
              Connect
            </button>
            <button
              (click)="delete(conn)"
              class="rounded-lg bg-neutral-800 px-3 py-1.5 text-sm text-neutral-400 transition-colors hover:bg-neutral-700 hover:text-white"
            >
              Delete
            </button>
          </div>
        </div>
      }
    </div>
  }
</div>
