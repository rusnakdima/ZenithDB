<div class="space-y-4">
  <div class="space-y-2">
    <div class="flex items-center justify-between">
      <label class="text-xs tracking-wide text-[var(--text-dim)] uppercase">Fields</label>
      <button
        type="button"
        class="text-xs text-[var(--accent)] transition-colors hover:text-[var(--accent-hover)]"
        (click)="addField()"
      >
        + Add field
      </button>
    </div>

    @if (config.fields.length === 0) {
      <div
        class="rounded border border-dashed border-[var(--border-color)] p-4 text-center text-xs text-[var(--text-muted)]"
      >
        No fields defined. Click "Add field" to include/exclude fields.
      </div>
    }

    <div class="space-y-2">
      @for (field of config.fields; track field.name; let i = $index) {
        <div
          class="flex items-center gap-2 rounded border border-[var(--border-color)] bg-[var(--bg-elevated)] p-2"
        >
          <input
            type="text"
            class="flex-1 rounded border border-[var(--border-color)] bg-[var(--bg-elevated)] px-2 py-1.5 text-sm text-[var(--text-main)] focus:border-[var(--accent)] focus:outline-none"
            placeholder="Field name"
            [ngModel]="field.name"
            (ngModelChange)="updateFieldName(i, $event)"
          />

          <label class="flex items-center gap-1 text-xs text-[var(--text-dim)]">
            <input
              type="checkbox"
              class="rounded border-[var(--border-color)] bg-[var(--bg-elevated)]"
              [ngModel]="field.include"
              (ngModelChange)="updateFieldInclude(i, $event)"
            />
            Include
          </label>

          <button
            type="button"
            class="p-1 text-[var(--text-muted)] hover:text-red-400"
            (click)="removeField(i)"
          >
            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          </button>
        </div>

        @if (field.include && field.name) {
          <div class="ml-4 flex items-center gap-2">
            <input
              type="text"
              class="flex-1 rounded border border-[var(--border-color)] bg-[var(--bg-elevated)] px-2 py-1.5 font-mono text-xs text-[var(--text-main)] focus:border-[var(--accent)] focus:outline-none"
              placeholder="Expression (e.g., { $toUpper: '$name' })"
              [ngModel]="field.expression"
              (ngModelChange)="updateFieldExpression(i, $event)"
            />
          </div>
        }
      }
    </div>
  </div>

  <div class="space-y-2">
    <label class="text-xs tracking-wide text-[var(--text-dim)] uppercase">Quick Actions</label>
    <div class="flex flex-wrap gap-2">
      <button
        type="button"
        class="rounded border border-[var(--border-color)] px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        (click)="includeAllFields()"
      >
        Include All
      </button>
      <button
        type="button"
        class="rounded border border-[var(--border-color)] px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        (click)="excludeAllFields()"
      >
        Exclude All
      </button>
    </div>
  </div>
</div>
