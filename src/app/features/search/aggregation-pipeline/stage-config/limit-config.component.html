<div class="space-y-3">
  <div class="space-y-2">
    <label class="text-xs tracking-wide text-[var(--text-dim)] uppercase">Value</label>
    <input
      type="number"
      class="w-full rounded border border-[var(--border-color)] bg-[var(--bg-elevated)] px-3 py-2 text-sm text-[var(--text-main)] focus:border-[var(--accent)] focus:outline-none"
      placeholder="Enter value..."
      [ngModel]="config.value"
      (ngModelChange)="onValueChange($event)"
      min="0"
    />
  </div>
</div>
