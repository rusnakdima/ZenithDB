<div
  class="flex h-full flex-col rounded-lg border border-[var(--border-color)] bg-[var(--bg-deep)]"
>
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-[var(--border-color)] px-4 py-3">
    <h3 class="text-sm font-medium text-[var(--text-main)]">JSON Editor</h3>
    <div class="flex items-center gap-2">
      <button
        type="button"
        class="rounded px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        (click)="formatJson()"
      >
        Format
      </button>
      <button
        type="button"
        class="rounded px-2 py-1 text-xs text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--text-main)]"
        (click)="copyToClipboard()"
      >
        Copy
      </button>
    </div>
  </div>

  <!-- Editor -->
  <div class="flex-1 p-4">
    <textarea
      class="h-full w-full rounded border border-[var(--border-color)] bg-[var(--bg-elevated)] p-3 font-mono text-sm text-[var(--text-main)] focus:border-[var(--accent)] focus:outline-none"
      [ngModel]="jsonContent()"
      (ngModelChange)="onJsonChange($event)"
      placeholder="Enter aggregation pipeline JSON..."
      spellcheck="false"
    ></textarea>
  </div>

  <!-- Error Display -->
  @if (error()) {
    <div class="border-t border-[var(--color-error-border)] bg-[var(--color-error-bg)] px-4 py-2">
      <div class="flex items-center gap-2 text-xs text-[var(--color-error)]">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
        {{ error() }}
      </div>
    </div>
  }

  <!-- Footer -->
  <div class="flex items-center justify-between border-t border-[var(--border-color)] px-4 py-2">
    <span class="text-xs text-[var(--text-muted)]">
      @if (isValid()) {
        <span class="text-[var(--accent)]">Valid JSON</span>
      } @else if (jsonContent() && !error()) {
        <span class="text-[var(--color-warning)]">Empty or invalid</span>
      }
    </span>
    <span class="text-xs text-[var(--text-muted)]">{{ lineCount() }} lines</span>
  </div>
</div>
