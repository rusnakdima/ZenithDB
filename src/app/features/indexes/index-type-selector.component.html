<div class="grid grid-cols-3 gap-2">
  @for (option of indexTypes; track option.type) {
    <button
      type="button"
      class="flex flex-col items-start rounded-lg border p-3 transition-colors"
      [class.border-[var(--accent)]]="isSelected(option.type)"
      [class.bg-emerald-900/20]="isSelected(option.type)"
      [class.border-[var(--border-subtle)]]="!isSelected(option.type)"
      [class.hover:border-[var(--border-visible)]]="!isSelected(option.type)"
      (click)="onTypeSelect(option.type)"
    >
      <div class="mb-1 flex items-center gap-2">
        <span
          class="flex h-6 w-6 items-center justify-center rounded text-xs font-bold"
          [class.]="isSelected(option.type)"
          [class.text-white]="isSelected(option.type)"
          [class.bg-slate-700]="!isSelected(option.type)"
          [class.text-slate-300]="!isSelected(option.type)"
        >
          {{ option.icon }}
        </span>
        <span
          class="text-sm font-medium"
          [class.text-emerald-400]="isSelected(option.type)"
          [class.text-slate-300]="!isSelected(option.type)"
        >
          {{ option.label }}
        </span>
      </div>
      <p class="text-xs text-slate-500">{{ option.description }}</p>
    </button>
  }
</div>
