<app-modal [open]="true" title="Drop Index" size="sm" (closed)="onCancel()">
  <div class="flex flex-col gap-4">
    <div
      class="flex items-start gap-3 rounded-lg border border-[var(--border-subtle)] bg-red-900/20 p-4"
    >
      <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
        />
      </svg>
      <div>
        <h4 class="font-medium text-red-400">Confirm Drop Index</h4>
        <p class="mt-1 text-sm text-slate-300">
          Are you sure you want to drop the index
          <span class="font-mono text-red-300">{{ indexName }}</span
          >? This action cannot be undone.
        </p>
      </div>
    </div>
  </div>

  <div modal-footer>
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm text-slate-400 transition-colors hover:text-white"
      (click)="onCancel()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-red-500"
      (click)="onConfirm()"
    >
      Drop Index
    </button>
  </div>
</app-modal>
