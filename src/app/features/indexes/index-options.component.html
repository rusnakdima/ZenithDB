<div class="flex flex-col gap-4">
  <div class="grid grid-cols-2 gap-4">
    <label
      class="flex items-center gap-3 rounded-lg border border-[var(--border-subtle)] bg-slate-800/50 px-3 py-2"
    >
      <input
        type="checkbox"
        class="h-4 w-4 rounded border-[var(--border-subtle)] bg-slate-700 text-emerald-500 focus:ring-emerald-500"
        [checked]="options.unique"
        (change)="onUniqueChange($any($event.target).checked)"
      />
      <div>
        <span class="text-sm text-slate-200">Unique</span>
        <p class="text-xs text-slate-500">Enforce unique values</p>
      </div>
    </label>

    <label
      class="flex items-center gap-3 rounded-lg border border-[var(--border-subtle)] bg-slate-800/50 px-3 py-2"
    >
      <input
        type="checkbox"
        class="h-4 w-4 rounded border-[var(--border-subtle)] bg-slate-700 text-emerald-500 focus:ring-emerald-500"
        [checked]="options.sparse"
        (change)="onSparseChange($any($event.target).checked)"
      />
      <div>
        <span class="text-sm text-slate-200">Sparse</span>
        <p class="text-xs text-slate-500">Index null values sparsely</p>
      </div>
    </label>
  </div>

  @if (indexType === "ttl") {
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-300">TTL Field</label>
      <div class="flex items-center gap-2">
        <input
          type="text"
          class="flex-1 rounded-lg border border-[var(--border-subtle)] bg-slate-700 px-3 py-2 text-sm text-slate-200 focus:border-[var(--accent)] focus:outline-none"
          placeholder="Field name for TTL..."
          [ngModel]="options.ttlSeconds"
          (ngModelChange)="onTtlSecondsChange($event)"
        />
        <span class="text-sm text-slate-500">seconds</span>
      </div>
    </div>
  }

  @if (indexType === "text") {
    <div>
      <label class="mb-1 block text-sm font-medium text-slate-300">Default Language</label>
      <select
        class="w-full rounded-lg border border-[var(--border-subtle)] bg-slate-700 px-3 py-2 text-sm text-slate-200 focus:border-[var(--accent)] focus:outline-none"
        [ngModel]="options.defaultLanguage"
        (ngModelChange)="onDefaultLanguageChange($event)"
      >
        <option value="english">English</option>
        <option value="spanish">Spanish</option>
        <option value="french">French</option>
        <option value="german">German</option>
        <option value="chinese">Chinese</option>
        <option value="japanese">Japanese</option>
      </select>
    </div>
  }
</div>
