<div class="data-grid-container flex h-full w-full flex-col">
  @if (error) {
    <div
      class="m-4 flex items-center gap-2 rounded-xl border border-red-900/50 bg-red-900/20 px-4 py-3 text-red-400"
    >
      <mat-icon fontIcon="error" class="h-6! w-5! text-xl!" />
      <span>{{ error }}</span>
      <button class="ml-auto text-red-400 hover:text-red-300" (click)="error = ''">
        <mat-icon fontIcon="close" class="h-6! w-5! text-xl!" />
      </button>
    </div>
  }

  <div class="flex-1 overflow-hidden">
    <div class="table-wrapper h-full">
      @if (loading()) {
        <div class="flex h-64 items-center justify-center">
          <div
            class="h-8 w-8 animate-spin rounded-full border-2 border-[var(--accent)] border-t-transparent"
          ></div>
        </div>
      } @else if (data().length === 0) {
        <div class="flex h-64 flex-col items-center justify-center text-[var(--text-dim)]">
          <mat-icon fontIcon="table_chart" class="mb-4 h-12! w-12! text-xl! opacity-50" />
          <p class="text-lg font-bold">No data in this collection</p>
          <p class="mt-1 text-sm text-[var(--text-muted)]">Try adjusting your filter</p>
        </div>
      } @else {
        <app-data-table-grid
          [data]="data()"
          [columns]="visibleColumnsFiltered()"
          [columnWidths]="columnWidths()"
          [columnOrder]="columnOrder()"
          [sortColumn]="sortColumn()"
          [sortDirection]="sortDirection()"
          [selectedRows]="selectedRows()"
          [previewData]="data()"
          (sortChange)="onSort($event)"
          (columnDrop)="onColumnDrop($event)"
          (columnResizeStart)="onColumnResizeStart($event.col, $event.event)"
          (toggleSelectAll)="toggleSelectAll()"
          (toggleRow)="toggleRow($event)"
          (rowClick)="onRowClick($event.row, $event.event)"
          (viewJson)="viewJson($event)"
        />
      }
    </div>
  </div>

  <app-pagination
    class="flex flex-shrink-0"
    [totalItems]="total()"
    [currentPage]="page"
    [pageSize]="pageSize"
    (pageChange)="onPageChange($event)"
    (pageSizeChange)="changePageSize($event)"
  ></app-pagination>

  <app-export-dialog
    [visible]="showExportDialog()"
    [selectedCount]="selectedRows().size"
    [totalCount]="data().length"
    (exportData)="exportData($event)"
    (close)="closeExportDialog()"
  />
</div>
