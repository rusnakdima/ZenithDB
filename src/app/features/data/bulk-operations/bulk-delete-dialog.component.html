<app-modal [open]="true" title="Confirm Delete" size="sm" (closed)="onCancel()">
  <div class="flex flex-col gap-6">
    <div class="rounded-lg border border-[var(--border-subtle)] bg-transparent p-4">
      <div class="flex items-center gap-3">
        <div
          class="flex h-12 w-12 items-center justify-center rounded-full border border-[var(--border-subtle)]"
        >
          <svg
            class="h-6 w-6 text-[var(--accent)]"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </div>
        <div>
          <p class="text-sm font-medium text-[var(--accent)]">
            {{ getConfirmMessage() }}
          </p>
          <p class="mt-1 text-xs text-[var(--accent)]/70">This action cannot be undone</p>
        </div>
      </div>
    </div>

    <div class="space-y-3">
      <label class="flex cursor-pointer items-center gap-3">
        <input
          type="checkbox"
          class="h-4 w-4 rounded border-[var(--border-subtle)] bg-[var(--bg-elevated)] text-[var(--accent)] focus:ring-[var(--accent)]"
          [ngModel]="softDelete()"
          (ngModelChange)="onSoftDeleteChange($event)"
        />
        <span class="text-sm text-[var(--text-main)]">
          Perform soft delete (mark as deleted without removing data)
        </span>
      </label>
    </div>
  </div>

  <div modal-footer class="flex justify-end gap-3">
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm text-[var(--text-dim)] transition-colors hover:text-[var(--text-main)]"
      (click)="onCancel()"
      [disabled]="isProcessing()"
    >
      Cancel
    </button>
    <button
      type="button"
      class="rounded-lg px-4 py-2 text-sm font-medium text-[var(--text-on-accent)] transition-colors disabled:opacity-50"
      (click)="onConfirm()"
      [disabled]="isProcessing()"
    >
      @if (isProcessing()) {
        <span class="flex items-center gap-2">
          <svg class="h-4 w-4 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Deleting...
        </span>
      } @else {
        Delete Records
      }
    </button>
  </div>
</app-modal>
