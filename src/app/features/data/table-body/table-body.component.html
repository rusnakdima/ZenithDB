<div class="table-body-grid mono" [style.grid-template-columns]="gridTemplateColumns()">
  @for (row of data; track trackByRow($index, row); let rowIndex = $index) {
    <div
      class="grid-row table-row"
      [class.zebra]="rowIndex % 2 === 1"
      [class.selected]="isSelected(rowIndex)"
      [class.hovered]="hoveredRowIndex() === rowIndex"
      (mouseenter)="onRowHover(rowIndex)"
      (mouseleave)="onRowLeave()"
      (click)="onRowClick(row, $event, rowIndex)"
    >
      <div class="grid-cell checkbox-cell" (click)="$event.stopPropagation()">
        <app-checkbox [checked]="isSelected(rowIndex)" (changed)="onToggleRow(rowIndex)" />
      </div>
      @for (col of columns; track col.name) {
        <div
          class="grid-cell border-r border-[var(--border-subtle)]/50"
          [style.width.px]="columnWidths[col.name]"
        >
          <span class="cell-content">{{ row[col.name] | formatValue }}</span>
        </div>
      }
      <div class="grid-cell actions-cell" (click)="$event.stopPropagation()">
        <div class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100">
          <button
            class="rounded-lg p-2 text-[var(--text-dim)] transition-all hover:bg-[var(--bg-elevated)] hover:text-blue-400"
            title="View JSON"
            (click)="onViewJson(row)"
          >
            <mat-icon fontIcon="data_object" class="h-6! w-5! text-xl!" />
          </button>
        </div>
      </div>
    </div>
  }
</div>
