<thead class="sticky top-0 z-10 bg-[var(--bg-sidebar)]/95 backdrop-blur-sm">
  <tr
    cdkDropList
    [cdkDropListData]="visibleColumnsList"
    (cdkDropListDropped)="onColumnDrop($event)"
    cdkDropListOrientation="horizontal"
  >
    <th class="w-10 border-r border-b border-[var(--border-subtle)] p-3 text-center">
      <app-checkbox [checked]="allSelected" (changed)="onToggleSelectAll()" />
    </th>
    @for (col of columns; track col.name) {
      @if (visibleColumnsList.includes(col.name)) {
        <th
          class="relative cursor-move border-r border-b border-[var(--border-subtle)] p-3 text-left text-[10px] font-black tracking-widest text-[var(--text-dim)] uppercase select-none"
          cdkDrag
          [cdkDragData]="col.name"
          [style.width.px]="columnWidths[col.name]"
        >
          <div class="flex items-center gap-2">
            <app-sortable-header
              [column]="col.name"
              [currentSort]="sortColumn"
              [direction]="sortColumn === col.name ? sortDirection : 'none'"
              (sortChange)="onSort($event)"
            />
            <app-data-type-badge [dataType]="col.data_type" variant="icon" />
          </div>
          <div
            class="resize-handle absolute top-0 right-0 bottom-0 w-1 cursor-col-resize transition-colors hover:bg-[var(--accent)]/50"
            (mousedown)="onColumnResizeStart(col.name, $event)"
          ></div>
        </th>
      }
    }
    <th
      class="w-28 border-b border-[var(--border-subtle)] p-3 text-left text-[10px] font-black tracking-widest text-[var(--text-dim)] uppercase"
    >
      Actions
    </th>
  </tr>
</thead>
