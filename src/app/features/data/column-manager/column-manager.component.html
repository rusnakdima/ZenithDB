<ng-template cdkDragPlaceholder>
  <div class="column-drag-placeholder"></div>
</ng-template>

<ng-template cdkDragPreview>
  <div class="column-drag-preview" [style.width.px]="previewWidth()">
    <div class="preview-header-cell">
      <span class="preview-col-name">{{ draggedColumnName() }}</span>
    </div>
    @for (row of previewRows(); track $index) {
      <div class="preview-data-cell">
        <span class="preview-cell-content">{{ getCellValue(row, draggedColumnName()) }}</span>
      </div>
    }
  </div>
</ng-template>

<div class="table-header-grid" [style.grid-template-columns]="gridTemplateColumns()">
  <div class="header-cell checkbox-cell">
    <app-checkbox [checked]="allSelected" (changed)="onToggleSelectAll()" />
  </div>
  @for (col of columns; track col.name) {
    <div
      class="header-cell relative cursor-move transition-colors select-none"
      cdkDrag
      [cdkDragData]="col.name"
      [style.width.px]="columnWidths[col.name]"
      (cdkDragStarted)="onDragStarted(col.name, columnWidths[col.name])"
      (cdkDragReleased)="onDragReleased()"
    >
      <div class="flex items-center gap-2">
        <app-sortable-header
          [column]="col.name"
          [currentSort]="sortColumn"
          [direction]="sortColumn === col.name ? sortDirection : 'none'"
          (sortChange)="onSort($event)"
        />
        <app-data-type-badge [dataType]="col.data_type" variant="icon" />
      </div>
      <div
        class="resize-handle hover: absolute top-0 right-0 bottom-0 w-2 cursor-col-resize bg-[var(--border-subtle)] transition-colors"
        (mousedown)="onColumnResizeStart(col.name, $event)"
      ></div>
    </div>
  }
  <div class="header-cell actions-cell">
    <button
      class="rounded p-1.5 text-[var(--text-dim)] transition-colors hover:bg-[var(--bg-elevated)] hover:text-[var(--accent)]"
      (click)="onToggleColumnMenu()"
      title="Show/Hide columns"
    >
      <mat-icon fontIcon="view_column" class="h-5! w-5! text-base!"></mat-icon>
    </button>
  </div>
</div>
