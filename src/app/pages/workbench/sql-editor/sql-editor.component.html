<div class="flex h-full flex-col font-mono text-sm">
  <div class="flex flex-1 overflow-hidden">
    <!-- Line Numbers Gutter -->
    <div class="workbench-editor-gutter">
      @for (line of lines; track $index) {
        <span class="px-2 font-mono text-xs leading-6">{{ $index + 1 }}</span>
      }
      @if (lines.length === 0) {
        <span class="px-2 font-mono text-xs leading-6">1</span>
      }
    </div>

    <!-- Editor Area with Completion Popup -->
    <div class="relative flex-1 overflow-auto">
      <textarea
        #editor
        class="absolute inset-0 z-10 h-full w-full cursor-text resize-none border-none bg-transparent px-4 py-3 font-mono text-sm leading-6 text-[var(--text-main)] outline-none placeholder:text-[var(--text-dim)]"
        [value]="query"
        (input)="onInput($event)"
        (keydown)="handleKeydown($event)"
        spellcheck="false"
        placeholder="Enter query... (Press Ctrl+Space for suggestions)"
      ></textarea>
      <app-completion-popup
        [items]="completionItems()"
        [position]="completionPosition()"
        [isVisible]="completionVisible()"
        (select)="onCompletionSelect($event)"
        (close)="onCompletionClose()"
      ></app-completion-popup>
    </div>
  </div>

  <!-- SQL Keywords Reference (collapsed, shown via tooltip) -->
  <div class="workbench-keywords-bar">
    <span class="text-[var(--text-muted)]">Keywords:</span>
    <span class="workbench-keyword">SELECT</span>
    <span class="workbench-keyword">FROM</span>
    <span class="workbench-keyword">WHERE</span>
    <span class="workbench-keyword">JOIN</span>
    <span class="workbench-keyword">LIMIT</span>
  </div>
</div>
