<app-modal
  [open]="connectionFormService.isOpen()"
  [title]="isEditing() ? 'Edit Connection' : 'New Connection'"
  size="lg"
  [showFooter]="true"
  (closed)="onClose()"
>
  <div class="space-y-5">
    <div>
      <label class="form-label">Provider</label>
      <select [ngModel]="provider" (ngModelChange)="onProviderChange($event)" class="form-input">
        <option value="json">JSON (Local Files)</option>
        <option value="sqlite">SQLite (Local File)</option>
        <option value="mongo">MongoDB</option>
        <option value="postgres">PostgreSQL</option>
        <option value="mysql">MySQL</option>
        <option value="redis">Redis</option>
      </select>
    </div>

    <app-connection-config-form
      [provider]="provider"
      [initialData]="formData()"
      (dataChange)="onFormDataChange($event)"
      (browseFile)="onBrowseFile($event)"
    />
  </div>

  <div class="mt-6 space-y-4">
    <button
      type="button"
      (click)="testConnection()"
      [disabled]="testing() || !isFormValid()"
      class="w-full rounded-xl border border-[var(--accent)] bg-[var(--accent)] px-6 py-3 text-sm font-bold text-[var(--text-on-accent)] transition-all hover:opacity-90 disabled:opacity-50"
    >
      @if (testing()) {
        <mat-icon fontIcon="sync" class="mr-2 h-6! w-5! text-xl!" />
        Testing...
      } @else {
        <mat-icon fontIcon="link" class="mr-2 h-6! w-5! text-xl!" />
        Test Connection
      }
    </button>

    @if (testResult(); as result) {
      <div
        class="flex items-center gap-3 rounded-xl border p-4"
        [class]="
          result.healthy
            ? 'border-[var(--color-success)] bg-[var(--color-success-bg)]'
            : 'border-[var(--color-error)] bg-[var(--color-error-bg)]'
        "
      >
        <div class="mt-0.5">
          @if (result.healthy) {
            <mat-icon fontIcon="check_circle" class="h-6! w-5! text-xl! text-green-500" />
          } @else {
            <mat-icon fontIcon="error" class="h-6! w-5! text-xl! text-[var(--color-error)]" />
          }
        </div>
        <div>
          <p
            class="text-sm font-medium"
            [class]="result.healthy ? 'text-[var(--color-success)]' : 'text-[var(--color-error)]'"
          >
            @if (result.healthy) {
              Connection successful!
            } @else {
              Connection failed: {{ result.message }}
            }
          </p>
        </div>
      </div>
    }
  </div>

  <div modal-footer class="flex justify-end gap-3">
    <button (click)="cancel()" class="form-btn form-btn-secondary">Cancel</button>
    <button
      (click)="save()"
      [disabled]="!isFormValid() || saving()"
      class="rounded-xl bg-[var(--accent)] px-6 py-3 text-sm font-bold text-[var(--text-on-accent)] transition-all hover:opacity-90 disabled:opacity-50"
    >
      @if (saving()) {
        <mat-icon fontIcon="sync" class="mr-2 h-6! w-5! text-xl!" />
        Saving...
      } @else {
        <mat-icon fontIcon="save" class="mr-2 h-6! w-5! text-xl!" />
        Save Connection
      }
    </button>
  </div>
</app-modal>
