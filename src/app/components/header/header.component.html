<div
  class="sticky top-0 z-40 w-full border-b border-transparent bg-transparent px-4 py-3 backdrop-blur-md"
>
  <div class="mx-auto flex max-w-7xl items-center justify-between">
    <div class="flex min-w-0 flex-1 items-center gap-2">
      <button
        class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full border border-[var(--accent)] bg-transparent shadow-sm backdrop-blur-sm transition-all hover:bg-[var(--accent)]/10 disabled:pointer-events-none disabled:opacity-0"
        [disabled]="historyLength() <= 1"
        (click)="goBack()"
        title="Go back"
      >
        <mat-icon class="!h-5 !w-5 !text-base text-[var(--text-dim)]" fontIcon="arrow_back" />
      </button>

      <div class="flex items-center gap-2">
        <div
          class="flex h-9 items-center justify-center gap-2 rounded-full bg-transparent px-3 py-2 shadow-sm backdrop-blur-sm"
        >
          <div
            class="flex h-6 w-6 items-center justify-center rounded-full bg-gradient-to-br from-[var(--accent)] to-[var(--accent-hover)]"
          >
            <mat-icon class="!h-5 !w-5 !text-base !text-white" fontIcon="storage" />
          </div>
          <h1 class="text-base font-semibold text-[var(--text-main)]">{{ pageTitle() }}</h1>
        </div>

        @if (breadcrumbs().length > 0) {
          <div class="hidden items-center gap-1 sm:flex">
            @for (crumb of breadcrumbs(); track crumb.url; let first = $first; let last = $last) {
              <mat-icon
                class="!h-4 !w-4 !text-base text-[var(--text-muted)]"
                fontIcon="chevron_right"
              />
              @if (!last) {
                <button
                  class="flex items-center justify-center gap-1.5 rounded-full border border-[var(--accent)] bg-transparent px-3 py-1 text-xs font-medium text-[var(--text-dim)] shadow-sm backdrop-blur-sm transition-all hover:bg-[var(--accent)]/10 hover:text-[var(--text-main)]"
                  (click)="navigateTo(crumb.url)"
                >
                  @if (first) {
                    <mat-icon class="!h-4 !w-4 !text-base" fontIcon="link" />
                  }
                  {{ crumb.label }}
                </button>
              } @else {
                <span
                  class="flex items-center justify-center gap-1.5 rounded-full border border-[var(--accent)] bg-transparent px-3 py-1 text-xs font-semibold text-[var(--accent)]"
                >
                  @if (first) {
                    <mat-icon class="!h-4 !w-4 !text-base" fontIcon="link" />
                  }
                  {{ crumb.label }}
                </span>
              }
            }
          </div>
        }
      </div>
    </div>

    <div class="flex flex-shrink-0 items-center gap-2">
      <button
        class="flex h-9 items-center justify-center rounded-full border border-[var(--accent)] bg-transparent px-3 py-2 shadow-sm backdrop-blur-sm transition-all hover:bg-[var(--accent)]/10"
        title="Toggle theme"
        (click)="toggleTheme()"
      >
        <mat-icon
          class="!h-5 !w-5 !text-base text-[var(--text-dim)]"
          [fontIcon]="isDarkMode() ? 'light_mode' : 'dark_mode'"
        />
      </button>
    </div>
  </div>
</div>
