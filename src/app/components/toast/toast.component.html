<div
  class="relative flex items-start gap-3 rounded-lg border-l-4 bg-slate-900 p-4 text-slate-200 shadow-lg"
  [class.border-emerald-500]="toast().type === 'success'"
  [class.border-red-500]="toast().type === 'error'"
  [class.border-amber-500]="toast().type === 'warning'"
  [class.border-blue-500]="toast().type === 'info'"
  role="alert"
>
  <div class="mt-0.5 flex-shrink-0">
    @switch (toast().type) {
      @case ("success") {
        <svg class="h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M5 13l4 4L19 7"
          />
        </svg>
      }
      @case ("error") {
        <svg class="h-5 w-5 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      }
      @case ("warning") {
        <svg class="h-5 w-5 text-amber-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
      }
      @case ("info") {
        <svg class="h-5 w-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
          />
        </svg>
      }
    }
  </div>

  <div class="min-w-0 flex-1">
    @if (toast().title) {
      <p class="text-sm font-semibold">{{ toast().title }}</p>
    }
    <p class="text-sm" [class.font-medium]="!toast().title">{{ toast().message }}</p>
    @if (toast().action) {
      <button
        class="mt-2 text-sm font-medium text-emerald-400 transition-colors hover:text-emerald-300"
        (click)="onAction()"
      >
        {{ toast().action!.label }}
      </button>
    }
  </div>

  <button
    class="flex-shrink-0 text-slate-400 transition-colors hover:text-slate-200"
    (click)="onDismiss()"
    aria-label="Dismiss"
  >
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="2"
        d="M6 18L18 6M6 6l12 12"
      />
    </svg>
  </button>

  @if (!toast().persistent && toast().duration && toast().duration > 0) {
    <div class="absolute right-0 bottom-0 left-0 h-1 overflow-hidden rounded-b-lg bg-slate-700">
      <div
        class="h-full"
        [class.bg-emerald-500]="toast().type === 'success'"
        [class.bg-red-500]="toast().type === 'error'"
        [class.bg-amber-500]="toast().type === 'warning'"
        [class.bg-blue-500]="toast().type === 'info'"
        [style.width]="'100%'"
      ></div>
    </div>
  }
</div>
